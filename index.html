<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
  --surface3: #2a2f46; --border: #2e3350;
  --text: #e2e8f0; --text2: #8892a4; --text3: #4a5568;
  --accent: #4f8ef7; --ok: #22c55e; --warn: #f59e0b;
  --danger: #ef4444; --info: #38bdf8; --radius: 10px;
}
[data-theme="light"] {
  --bg: #f4f6fb; --surface: #ffffff; --surface2: #f0f4ff;
  --surface3: #e8edf7; --border: #d1d5db;
  --text: #111827; --text2: #6b7280; --text3: #9ca3af;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Meiryo', 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 54px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-left { display: flex; align-items: center; gap: 10px; }
.logo { width: 30px; height: 30px; background: linear-gradient(135deg, var(--accent), #6ee7b7); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: #fff; }
.header-title { font-size: 14px; font-weight: 700; }
.header-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
.header-right { display: flex; gap: 8px; align-items: center; }
.conn-badge { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
.conn-badge.offline { background: var(--surface2); color: var(--text3); }
.conn-badge.connecting { background: rgba(245,158,11,0.15); color: var(--warn); }
.conn-badge.online { background: rgba(34,197,94,0.15); color: var(--ok); }
.user-chip { font-size: 11px; color: var(--accent); background: rgba(79,142,247,0.12); padding: 3px 10px; border-radius: 20px; font-weight: 600; display: none; }
.theme-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; color: var(--text2); font-size: 14px; display: flex; align-items: center; justify-content: center; }

.loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
.loading-overlay.show { display: flex; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--text2); }

.login-card { max-width: 480px; margin: 60px auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px; text-align: center; }
.login-icon { font-size: 40px; margin-bottom: 12px; }
.login-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; line-height: 1.7; }
.btn-primary { background: var(--accent); color: #fff; border: none; padding: 14px 32px; border-radius: var(--radius); font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

.tabs { background: var(--surface); border-bottom: 1px solid var(--border); display: none; padding: 0 24px; gap: 2px; }
.tab { padding: 12px 18px; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; background: none; border-left: none; border-right: none; border-top: none; font-family: inherit; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.main { max-width: 880px; margin: 0 auto; padding: 28px 20px; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.steps-bar { display: flex; align-items: center; margin-bottom: 28px; }
.step-node { display: flex; flex-direction: column; align-items: center; }
.step-circle { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text3); transition: all 0.3s; }
.step-circle.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px rgba(79,142,247,0.2); }
.step-circle.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.step-label-text { font-size: 10px; color: var(--text3); margin-top: 4px; white-space: nowrap; }
.step-line { flex: 1; height: 2px; background: var(--border); margin: 0 6px 14px; transition: background 0.3s; }
.step-line.done { background: var(--ok); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; animation: fadeUp 0.2s ease; }

.input-lg:focus { outline: none; border-color: var(--accent); }

.input-row { display: flex; gap: 10px; margin-top: 12px; }
.btn-query { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 12px 28px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: inherit; transition: all 0.2s; }
.btn-query:hover { opacity: 0.88; }
.btn-secondary { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 18px; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; font-family: inherit; transition: all 0.2s; }
.btn-secondary:hover { border-color: var(--text2); color: var(--text); }
.btn-back { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 20px; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; font-family: inherit; transition: all 0.2s; }
.btn-back:hover { border-color: var(--text2); }
.btn-send { flex: 1; background: var(--ok); border: none; border-radius: var(--radius); padding: 14px 24px; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer; font-family: inherit; transition: all 0.2s; }
.btn-send:hover { opacity: 0.88; }

.info-box { background: rgba(79,142,247,0.08); border: 1px solid rgba(79,142,247,0.25); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--info); margin-bottom: 12px; }

.err-box { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--danger); margin-bottom: 12px; }

.master-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: var(--ok); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; }
.no-master-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: var(--warn); border-radius: 20px; padding: 4px 14px; font-size: 12px; font-weight: 600; cursor: pointer; background-color: transparent; font-family: inherit; }
.no-master-btn:hover { background: rgba(245,158,11,0.15); }

.chips-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; color: var(--text2); cursor: pointer; transition: all 0.2s; }
.chip:hover { border-color: var(--accent); color: var(--accent); }

.send-info-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.send-info-row { display: flex; gap: 10px; margin-bottom: 5px; font-size: 13px; }
.send-info-row:last-child { margin-bottom: 0; }
.send-info-label { color: var(--text2); font-weight: 700; min-width: 45px; }

.preview-outer { background: #6b7280; border-radius: 8px; padding: 16px; overflow-x: auto; margin-bottom: 8px; }

.c-signs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.c-sign-box { border: 1px solid #000; padding: 10px; min-height: 90px; font-size: 11px; }
.c-sign-title { font-size: 10px; color: #333; font-weight: 700; margin-bottom: 5px; }
.c-sign-stamp { text-align: right; font-size: 10px; color: #bbb; margin-top: 14px; }

.nav-row { display: flex; gap: 10px; margin-top: 20px; }

.complete-wrap { text-align: center; padding: 40px 16px; }
.complete-icon { font-size: 60px; margin-bottom: 16px; }
.complete-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: var(--ok); }
.complete-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; }
.complete-info { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: left; margin-bottom: 24px; }
.ci-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.ci-row:last-child { border-bottom: none; }
.ci-label { color: var(--text2); }

.section-title { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 14px; }
.history-list { display: flex; flex-direction: column; gap: 10px; }
.history-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.history-no { font-size: 14px; font-weight: 700; color: var(--accent); }
.history-meta { font-size: 12px; color: var(--text2); margin-top: 3px; }
.status-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
.status-sent { background: rgba(34,197,94,0.15); color: var(--ok); }

.powered { text-align: center; font-size: 11px; color: var(--text3); margin-top: 40px; padding: 20px; }
</style>

<div class="header">

      <div class="header-title">LEENAI 契約書自動発行ツール</div>

      COMPASSに登録された購買契約を照会し、<br>

<script>
// ═══════════════════════════════════════
// 定数
// ═══════════════════════════════════════
const CLIENT_ID    = 'f071a165-5e9b-44bf-b6a1-baba654524db';
const TENANT_ID    = 'a56988ff-c2b8-4df8-9727-889ad4205198';
const DV_URL       = 'https://orgde512c6f.crm7.dynamics.com';
const DV_API       = `${DV_URL}/api/data/v9.2`;
const REDIRECT_URI = location.origin + location.pathname;
const DV_SCOPE     = `${DV_URL}/user_impersonation openid profile`;
const GRAPH_SCOPE  = 'https://graph.microsoft.com/Mail.Send openid profile';
const DB_NAME      = 'leenai_contract_send_v1';
const DB_STORE     = 'send_history';

// ═══════════════════════════════════════
// 状態
// ═══════════════════════════════════════
const S = {
  dvToken: '', dvExpiry: 0,
  graphToken: '', graphExpiry: 0,
  userEmail: '', userName: '',
  contractMaster: [], masterFileName: '',
  step: 0,
  contractNo: '',
  contractData: null,
  lastSent: null,
};

// ═══════════════════════════════════════
// IndexedDB
// ═══════════════════════════════════════
let db = null;
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(DB_STORE)) {
        d.createObjectStore(DB_STORE, { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = e => rej(e.target.error);
  });
}
function dbAdd(record) {
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    const req = tx.objectStore(DB_STORE).add(record);
    req.onsuccess = () => res(req.result);
    req.onerror = e => rej(e.target.error);
  });
}
function dbGetAll() {
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).getAll();
    req.onsuccess = () => res([...req.result].reverse());
    req.onerror = e => rej(e.target.error);
  });
}

// ═══════════════════════════════════════
// PKCE OAuth
// ═══════════════════════════════════════
function b64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function sha256(str) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
}
function randomStr(len) {
  const a = new Uint8Array(len || 64);
  crypto.getRandomValues(a);
  return b64url(a).slice(0, len || 64);
}

async function startLogin(scope) {
  setConn('connecting', '● 接続中...');
  const useScope = scope || DV_SCOPE;
  const verifier = randomStr(64);
  const challenge = b64url(await sha256(verifier));
  const state = 'cs_' + randomStr(16);
  sessionStorage.setItem('pkce_verifier', verifier);
  sessionStorage.setItem('pkce_state', state);
  sessionStorage.setItem('pkce_scope_type', scope === GRAPH_SCOPE ? 'graph' : 'dv');
  const params = new URLSearchParams({
    client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI,
    scope: useScope, state, code_challenge: challenge, code_challenge_method: 'S256',
    prompt: 'select_account'
  });
  location.href = `https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/authorize?${params}`;
}

async function handleCallback() {
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if (!code) return false;
  history.replaceState({}, '', location.pathname);

  const verifier = sessionStorage.getItem('pkce_verifier');
  const scopeType = sessionStorage.getItem('pkce_scope_type') || 'dv';
  const useScope = scopeType === 'graph' ? GRAPH_SCOPE : DV_SCOPE;
  sessionStorage.removeItem('pkce_verifier');
  sessionStorage.removeItem('pkce_state');
  sessionStorage.removeItem('pkce_scope_type');

  showLoading('認証処理中...');
  try {
    const res = await fetch(`https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: CLIENT_ID, grant_type: 'authorization_code',
        code, redirect_uri: REDIRECT_URI, code_verifier: verifier, scope: useScope
      })
    });
    const data = await res.json();
    if (!data.access_token) throw new Error(data.error_description || 'トークン取得失敗');

    if (scopeType === 'graph') {
      S.graphToken = data.access_token;
      S.graphExpiry = Date.now() + (data.expires_in - 60) * 1000;
      // 保存済み契約データ復元
      const pending = sessionStorage.getItem('pending_contract');
      const pendingNo = sessionStorage.getItem('pending_contract_no');
      sessionStorage.removeItem('pending_contract');
      sessionStorage.removeItem('pending_contract_no');
      hideLoading();
      await initMainUI();
      if (pending) {
        S.contractData = JSON.parse(pending);
        S.contractNo = pendingNo || '';
        setStep(1);
        showMsg('info-box', '✅ 認証完了。発送ボタンをもう一度押してください。', 'stepContent', true);
      } else {
        setStep(0);
      }
    } else {
      S.dvToken = data.access_token;
      S.dvExpiry = Date.now() + (data.expires_in - 60) * 1000;
      try {
        const me = await fetch('https://graph.microsoft.com/v1.0/me', {
          headers: { Authorization: `Bearer ${S.dvToken}` }
        }).then(r => r.json());
        S.userName = me.displayName || '';
        S.userEmail = me.mail || me.userPrincipalName || '';
        const uc = document.getElementById('userChip');
        uc.textContent = S.userName;
        uc.style.display = 'inline-block';
      } catch(e) {}
      setConn('online', '● Dataverse接続');
      hideLoading();
      await initMainUI();
      setStep(0);
    }
  } catch(e) {
    hideLoading();
    setConn('offline', '● オフライン');
    alert('認証エラー: ' + e.message);
  }
  return true;
}

async function dvGet(path) {
  if (Date.now() > S.dvExpiry) throw new Error('セッション切れです。再ログインしてください。');
  const res = await fetch(`${DV_API}/${path}`, {
    headers: {
      'Authorization': `Bearer ${S.dvToken}`,
      'OData-MaxVersion': '4.0', 'OData-Version': '4.0',
      'Accept': 'application/json',
      'Prefer': 'odata.include-annotations="OData.Community.Display.V1.FormattedValue"'
    }
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(`DV API ${res.status}: ${e?.error?.message || res.statusText}`);
  }
  return res.json();
}

function setConn(cls, text) {
  const b = document.getElementById('connBadge');
  b.className = 'conn-badge ' + cls;
  b.textContent = text;
}
function showLoading(text) {
  document.getElementById('loadingText').textContent = text || '処理中...';
  document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('show');
}
function toggleTheme() {
  const h = document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}
function showTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
  if (id === 'history') renderHistory();
}
function showMsg(cls, msg, containerId, prepend) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = msg;
  if (prepend) el.prepend(div); else el.appendChild(div);
  setTimeout(() => div.remove(), 5000);
}

function renderStepsBar() {
  const labels = ['① 契約番号', '② 内容確認', '③ 発送完了'];
  let html = '';
  labels.forEach((label, i) => {
    if (i > 0) html += `<div class="step-line ${i <= S.step ? 'done' : ''}"></div>`;
    const cls = i < S.step ? 'done' : i === S.step ? 'active' : '';
    html += `<div class="step-node">
      <div class="step-circle ${cls}">${i < S.step ? '✓' : i + 1}</div>
      <div class="step-label-text">${label}</div>
    </div>`;
  });
  document.getElementById('stepsBar').innerHTML = html;
}

function setStep(n) {
  S.step = n;
  renderStepsBar();
  const renders = [renderStep0, renderStep1, renderStep2];
  document.getElementById('stepContent').innerHTML = renders[n]();
}

function loadMasterFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      S.contractMaster = XLSX.utils.sheet_to_json(ws);
      S.masterFileName = file.name;
      setStep(0);
    } catch(err) {
      alert('ファイル読み込みエラー: ' + err.message);
    }
  };
  input.click();
}

async function queryContract() {
  const no = S.contractNo.trim();
  if (!no) { alert('契約番号を入力してください。'); return; }
  if (!S.dvToken || Date.now() > S.dvExpiry) { alert('Dataverseセッション切れです。再ログインしてください。'); return; }

  const errEl = document.getElementById('step0err');
  if (errEl) errEl.innerHTML = '';

  showLoading('COMPASS照会中...');
  try {
    // 1. 契約ヘッダー
    const hdrRes = await dvGet(
      `cr49f_purchase_contracts?$filter=cr49f_purchase_contract_no eq '${no}'&$top=1` +
      `&$select=cr49f_purchase_contractid,cr49f_purchase_contract_no,` +
      `cr49f_contract_date,cr49f_latest_vanning,cr49f_payment_term,` +
      `cr49f_exchange_rate,_cr49f_packer_id_value`
    );
    if (!hdrRes.value?.length) throw new Error(`「${no}」がCOMPASSに見つかりません`);
    const h = hdrRes.value[0];
    const contractId = h.cr49f_purchase_contractid;
    const packerGuid = h['_cr49f_packer_id_value'];
    if (!packerGuid) throw new Error('Packer情報が取得できません');

    // 2. 明細
    const detRes = await dvGet(
      `cr49f_purchase_details?$filter=_cr49f_purchase_contract_id_value eq ${contractId}` +
      `&$expand=cr49f_item_id($select=cr49f_item,crcf9_item_japan)` +
      `&$select=cr49f_count,cr49f_incoterms,cr49f_loading_port,cr49f_price,cr49f_quantity,cr49f_remark`
    );

    // 3. Packer
    const pkRes = await dvGet(
      `cr49f_packers(${packerGuid})` +
      `?$select=cr49f_packer_name,cr49f_packer_address,cr49f_packer_person,` +
      `cr49f_packer_tel,cr49f_parker_fax,cr49f_packer,cr49f_packer_code`
    );

    // 4. メールアドレス (MASTER)
    const packerCode = pkRes.cr49f_packer || '';
    let toAddr = '', ccAddrs = [];
    if (S.contractMaster.length && packerCode) {
      const row = S.contractMaster.find(r => r.PACKER_CODE === packerCode);
      if (row) {
        toAddr = row.MAIL1 || '';
        ccAddrs = ['MAIL2','MAIL3','MAIL4','MAIL5','MAIL6','MAIL7','MAIL8']
          .map(k => row[k]).filter(Boolean);
      }
    }
    if (!ccAddrs.includes('rcp@leenearcorp.com')) {
      ccAddrs.push('rcp@leenearcorp.com');
    }

    const details = (detRes.value || []).map(d => {
      const qty = (d.cr49f_quantity || 0) * 1000;
      return {
        itemCode: d.cr49f_item_id?.cr49f_item || '',
        itemName: d.cr49f_item_id?.crcf9_item_japan || '',
        qty,
        count: d.cr49f_count || 0,
        price: d.cr49f_price || 0,
        pol: d.cr49f_loading_port || '',
        incoterms: d.cr49f_incoterms || '',
        remark: d.cr49f_remark || '',
        amount: Math.floor(qty * (d.cr49f_price || 0)),
      };
    });

    S.contractData = { header: h, details, packer: pkRes, toAddr, ccAddrs };

    const recent = JSON.parse(sessionStorage.getItem('recent_cn') || '[]');
    if (!recent.includes(no)) { recent.unshift(no); if (recent.length > 5) recent.pop(); }
    sessionStorage.setItem('recent_cn', JSON.stringify(recent));

    hideLoading();
    setStep(1);
  } catch(e) {
    hideLoading();
    const errEl = document.getElementById('step0err');
    if (errEl) errEl.innerHTML = `<div class="err-box">❌ ${e.message}</div>`;
  }
}

function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}

function fmtNum(n) {
  return Number(n || 0).toLocaleString('ja-JP');
}

async function doSend() {
  if (!S.contractData) return;
  const { header: h, details, packer: pk, toAddr, ccAddrs } = S.contractData;
  const contractNo = h.cr49f_purchase_contract_no || '';
  const packerCode = pk.cr49f_packer_code || pk.cr49f_packer || '';

  if (!S.graphToken || Date.now() > S.graphExpiry) {
    const go = confirm('メール発送にはMicrosoft認証が必要です。\nログイン画面に移動しますか？');
    if (!go) return;
    sessionStorage.setItem('pending_contract', JSON.stringify(S.contractData));
    sessionStorage.setItem('pending_contract_no', contractNo);
    await startLogin(GRAPH_SCOPE);
    return;
  }

  showLoading('PDF生成中...');
  try {
    const previewEl = document.getElementById('contractPreview');
    const canvas = await html2canvas(previewEl, {
      scale: 2, useCORS: true, backgroundColor: '#ffffff',
      width: previewEl.offsetWidth, height: previewEl.scrollHeight
    });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const pdfW = pdf.internal.pageSize.getWidth();
    const pdfH = (canvas.height * pdfW) / canvas.width;
    pdf.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH);
    const pdfBlob = pdf.output('blob');
    const pdfB64 = await blobToBase64(pdfBlob);
    const pdfFilename = `${contractNo}_${packerCode}_購買契約書.pdf`;

    showLoading('メール送信中...');

    const packerName = pk.cr49f_packer_name || '';
    const personName = pk.cr49f_packer_person || '';
    const mailBody = [
      `<p>${packerName}<br>${personName} 様</p>`,
      `<p>いつも大変お世話になっております。</p>`,
      `<p>添付の通り、御契約書をお送りさせて頂きますので、<br>ご確認後サインバックをお願い致します。</p>`,
      `<p>どうぞよろしくお願い致します。</p>`,
      `<p>株式会社リニア<br>${S.userName || ''}</p>`,
      `<p style="color:#999;font-size:12px;">このメールはLEENAI自動化システムより送信されました。</p>`
    ].join('\n');

    const gRes = await fetch('https://graph.microsoft.com/v1.0/me/sendMail', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${S.graphToken}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: {
          subject: `[${contractNo}] 御契約書のご送付　[リニア発信専用]`,
          body: { contentType: 'html', content: mailBody },
          toRecipients: [{ emailAddress: { address: toAddr } }],
          ccRecipients: ccAddrs.map(a => ({ emailAddress: { address: a } })),
          attachments: [{
            '@odata.type': '#microsoft.graph.fileAttachment',
            name: pdfFilename,
            contentType: 'application/pdf',
            contentBytes: pdfB64
          }]
        },
        saveToSentItems: true
      })
    });

    if (!gRes.ok) {
      const gErr = await gRes.json().catch(() => ({}));
      throw new Error(`Graph API ${gRes.status}: ${gErr?.error?.message || gRes.statusText}`);
    }

    const record = {
      contract_no: contractNo,
      packer_name: packerName,
      packer_code: packerCode,
      sent_at: new Date().toISOString(),
      sent_by: S.userEmail,
      to_addr: toAddr,
      pdf_filename: pdfFilename,
      status: 'sent'
    };
    await dbAdd(record);
    S.lastSent = record;
    hideLoading();
    setStep(2);
  } catch(e) {
    hideLoading();
    alert('発送エラー: ' + e.message);
  }
}

function blobToBase64(blob) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.readAsDataURL(blob);
  });
}

        <div class="ci-row"><span class="ci-label">PDFファイル</span><strong>${r.pdf_filename || ''}</strong></div>
        <div class="ci-row"><span class="ci-label">発送日時</span><strong>${sentTime}</strong></div>
        <div class="ci-row"><span class="ci-label">発信者</span><strong>${r.sent_by || ''}</strong></div>
      </div>
      <button class="btn-primary" onclick="resetSend()">別の契約書を発行する</button>
    </div>
  </div>`;
}

function resetSend() {
  S.step = 0;
  S.contractNo = '';
  S.contractData = null;
  S.lastSent = null;
  setStep(0);
}

// ═══════════════════════════════════════
// 履歴
// ═══════════════════════════════════════
async function renderHistory() {
  if (!db) return;
  const records = await dbGetAll();
  const el = document.getElementById('historyList');
  if (!records.length) {
    el.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:20px 0;">発送履歴がありません</div>';
    return;
  }
  el.innerHTML = records.map(r => {
    const time = r.sent_at ? new Date(r.sent_at).toLocaleString('ja-JP') : '—';
    const cls = r.status === 'sent' ? 'status-sent' : 'status-failed';
    const label = r.status === 'sent' ? '✅ 送信済' : '❌ 失敗';
    return `<div class="history-item">
      <div>
        <div class="history-no">${r.contract_no}</div>
        <div class="history-meta">${r.packer_name} · To: ${r.to_addr}</div>
        <div class="history-meta">${r.pdf_filename}</div>
        <div class="history-meta">${time} · ${r.sent_by}</div>
      </div>
      <span class="status-badge ${cls}">${label}</span>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════
// 起動
// ═══════════════════════════════════════
(async function init() {
  const handled = await handleCallback();
  if (!handled) {
    // show login (already visible by default)
  }
})();
</script>
</body>
</html>
