<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link id="leenaiFavicon" rel="icon">
<link rel="stylesheet" href="https://mhlee205.github.io/LEENAI_COMMON/v1/leenai-common.css">
<script src="https://mhlee205.github.io/LEENAI_COMMON/v1/leenai-common.js"></script>
<script>if(!window.LEENAI){document.addEventListener('DOMContentLoaded',function(){document.body.innerHTML='<div style="padding:40px;font-family:sans-serif">共通ファイルの読み込みに失敗しました。ページを再読み込みしてください。</div>';});}</script>
<style>
.card{background:var(--read);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:14px}
.stat{font-family:var(--mono);font-size:13px;margin:4px 0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.danger{color:var(--danger)}.info{color:var(--info)}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.cg>div{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.8}
.cg b{display:block;font-size:11px;color:var(--text2);font-weight:600}
@media(max-width:700px){.cg{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app" style="display:none">
  <main style="max-width:900px;margin:0 auto;padding:24px 20px">
    <div class="card">
      <h3>&#35469;&#35388;&#12473;&#12486;&#12540;&#12479;&#12473;</h3>
      <div class="stat">Dataverse: <span id="st-dv">-</span></div>
      <div class="stat">Graph: <span id="st-gr">-</span></div>
      <div class="stat">graphError: <span id="st-grerr" style="color:var(--warn)">-</span></div>
    </div>
    <div class="card">
      <h3>&#12518;&#12540;&#12470;&#12540;&#24773;&#22577;</h3>
      <div class="stat">name: <span id="u-name">-</span></div>
      <div class="stat">email: <span id="u-email">-</span></div>
      <div class="stat">staffCode: <span id="u-staff">-</span></div>
    </div>
    <div class="card">
      <h3>Dataverse &#30094;&#36890; (WhoAmI)</h3>
      <div class="stat" id="dv-result">-</div>
    </div>
    <div class="card">
      <h3>Graph &#30094;&#36890; (GET /me)</h3>
      <div class="stat" id="gr-result">-</div>
    </div>
    <div class="card">
      <h3>&#12488;&#12540;&#12463;&#12531;&#26356;&#26032;&#12486;&#12473;&#12488; (?debug=1 &#24517;&#35201;)</h3>
      <button class="ln-btn-ghost" id="btn-refresh">&#26399;&#38480;&#24378;&#21046; → token('dataverse') &#20877;&#21462;&#24471;</button>
      <div class="stat" id="refresh-result" style="margin-top:8px">URL&#12395; ?debug=1 &#12434;&#20184;&#12369;&#12390;&#12363;&#12425;&#12486;&#12473;&#12488;</div>
    </div>
    <div class="card">
      <h3>&#25991;&#23383;&#33394;&#12481;&#12455;&#12483;&#12463; (&#20840;&#12486;&#12540;&#12510;&#12391;&#35501;&#12417;&#12427;&#12371;&#12392;)</h3>
      <div id="cgrid"></div>
    </div>
    <div class="card">
      <h3>SharePoint &#30758;&#36890;</h3>
      <div class="stat" id="sp-files-result">-</div>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <input class="fi" id="sp-contract-input" placeholder="&#22özm;&#32004;&#30058;&#21495; (&#20363;: NSG-2607-03)" style="max-width:220px;">
        <button class="ln-btn-ghost" id="sp-search-btn">LC JSON &#26908;&#32034;</button>
      </div>
      <div class="stat" id="sp-lc-result" style="margin-top:8px">-</div>
      <div id="sp-files-error" style="color:var(--danger);font-size:12px;margin-top:6px;"></div>
    </div>
    <div class="card">
      <h3>&#20849;&#36890;&#37096;&#21697;&#12486;&#12473;&#12488;</h3>
      <button class="ln-btn-ghost" onclick="LEENAI.loading.show('&#12525;&#12540;&#12487;&#12451;&#12531;&#12464;&#12486;&#12473;&#12488;&#20013;&#8230;');setTimeout(function(){LEENAI.loading.hide();},2000)" style="margin:4px">Loading 2&#31186;</button>
      <button class="ln-btn-ghost" onclick="LEENAI.toast('ok &#12486;&#12473;&#12488;','ok')" style="margin:4px">toast ok</button>
      <button class="ln-btn-ghost" onclick="LEENAI.toast('warn &#12486;&#12473;&#12488;','warn')" style="margin:4px">toast warn</button>
      <button class="ln-btn-ghost" onclick="LEENAI.toast('danger &#12486;&#12473;&#12488;','danger')" style="margin:4px">toast danger</button>
      <button class="ln-btn-ghost" onclick="LEENAI.toast('info &#12486;&#12473;&#12488;','info')" style="margin:4px">toast info</button>
      <button class="ln-btn-ghost" onclick="LEENAI.addHeaderButton({label:'&#12486;&#12473;&#12488;Btn',onClick:function(){alert('&#12إder&#12540;Btn!');}})" style="margin:4px">addHeaderButton</button>
    </div>
    <div class="card">
      <h3>COMPASS メタデータ確認</h3>
      <button class="ln-btn-ghost" id="meta-run-btn">メタデータ確認を実行</button>
      <div id="meta-result" style="margin-top:12px;font-size:12px;"></div>
      <button class="ln-btn-ghost" id="meta-copy-btn" style="margin-top:8px;display:none;">結果をコピー</button>
    </div>
  </main>
</div>
<script>
async function startTool(){
  var s=LEENAI.auth.status;
  var u=LEENAI.user;
  document.getElementById('st-dv').textContent=s.dataverse;
  document.getElementById('st-dv').className=s.dataverse==='ok'?'ok':'danger';
  document.getElementById('st-gr').textContent=s.graph;
  document.getElementById('st-gr').className=s.graph==='ok'?'ok':s.graph==='error'?'warn':'';
  document.getElementById('st-grerr').textContent=s.graphError||'-';
  if(u){
    document.getElementById('u-name').textContent=u.name;
    document.getElementById('u-email').textContent=u.email;
    document.getElementById('u-staff').textContent=u.staffCode;
  }
  try{
    var t=await LEENAI.auth.token('dataverse');
    var r=await fetch('https://orgde512c6f.crm7.dynamics.com/api/data/v9.2/WhoAmI()',{headers:{Authorization:'Bearer '+t,Accept:'application/json'}});
    var j=await r.json();
    document.getElementById('dv-result').innerHTML='<span class="ok">✔ UserId: '+j.UserId+'</span>';
  }catch(e){document.getElementById('dv-result').innerHTML='<span class="danger">✖ '+e.message+'</span>';}
  try{
    var gt=await LEENAI.auth.token('graph');
    if(gt){
      var r2=await fetch('https://graph.microsoft.com/v1.0/me',{headers:{Authorization:'Bearer '+gt}});
      var j2=await r2.json();
      document.getElementById('gr-result').innerHTML='<span class="ok">✔ '+j2.displayName+' / '+j2.mail+'</span>';
    } else {document.getElementById('gr-result').textContent='skip';}
  }catch(e){document.getElementById('gr-result').innerHTML='<span class="danger">✖ '+e.message+'</span>';}
  function tokTail(t){return t?t.slice(-10):'(none)';}
  function tokExp(t){
    try{
      var raw=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
      var bytes=Uint8Array.from(atob(raw),function(c){return c.charCodeAt(0);});
      var p=JSON.parse(new TextDecoder().decode(bytes));
      return p.exp?new Date(p.exp*1000).toLocaleTimeString('ja-JP'):'?';
    }catch(e){return '?';}
  }
  document.getElementById('btn-refresh').addEventListener('click',async function(){
    var el=document.getElementById('refresh-result');
    try{
      var before=await LEENAI.auth.token('dataverse');
      var bTail=tokTail(before), bExp=tokExp(before);
      LEENAI.auth._expireForTest();
      var after=await LEENAI.auth.token('dataverse');
      var aTail=tokTail(after), aExp=tokExp(after);
      var changed=bTail!==aTail;
      el.innerHTML='<span class="'+(changed?'ok':'warn')+'">'
        +(changed?'✔ 更新成功':'⚠ 変化なし')
        +' | 末尾: …'+bTail+' → …'+aTail
        +' | exp: '+bExp+' → '+aExp+'</span>';
    }catch(e){el.innerHTML='<span class="danger">✖ '+e.message+'</span>';}
  });
  var bgs=[['★ read','--read'],['frame','--frame'],['surface2','--surface2'],['surface3','--surface3']];
  var fgs=[['text','--text'],['text2','--text2'],['text3','--text3'],['accent','--accent'],['ok','--ok'],['warn','--warn'],['danger','--danger'],['info','--info']];
  var g=document.getElementById('cgrid'); g.className='cg';
  g.innerHTML=bgs.map(function(b){return '<div style="background:var('+b[1]+')"><b>'+b[0]+'</b>'+fgs.map(function(f){return '<div style="color:var('+f[1]+')">'+f[0]+'</div>';}).join('')+'</div>';}).join('');
  /* SharePoint 疎通 */
  var spStatus=LEENAI.auth.status;
  if(spStatus.graphError&&spStatus.graphError.startsWith('files:')){
    document.getElementById('sp-files-error').textContent='SharePoint 権限なし: '+spStatus.graphError;
  }
  LEENAI.sp.list(LEENAI.SP.PATH.LC_JSON[0]).then(function(files){
    document.getElementById('sp-files-result').innerHTML=
      '<span class="ok">✔ '+files.length+'件</span> | 最近5件: '+
      files.slice(-5).map(function(f){return f.name;}).join(', ');
  }).catch(function(e){
    document.getElementById('sp-files-result').innerHTML='<span class="danger">✖ '+e.message+'</span>';
  });
  document.getElementById('sp-search-btn').addEventListener('click',async function(){
    var contractNo=document.getElementById('sp-contract-input').value.trim();
    var el=document.getElementById('sp-lc-result');
    if(!contractNo){el.textContent='契約番号を入力してください';return;}
    el.textContent='検索中…';
    try{
      var found=null,foundName='';
      for(var pi=0;pi<LEENAI.SP.PATH.LC_JSON.length;pi++){
        var files=await LEENAI.sp.list(LEENAI.SP.PATH.LC_JSON[pi]);
        var match=files.filter(function(f){
          return f.name.startsWith(contractNo)&&f.name.endsWith('.json')&&!f.name.includes('_TT_BASE');
        });
        if(match.length>0){
          var fpath=LEENAI.SP.PATH.LC_JSON[pi]+'/'+match[0].name;
          found=await LEENAI.sp.getJson(fpath);
          foundName=match[0].name;
          break;
        }
      }
      if(!found){el.innerHTML='<span class="warn">⚠ 見つかりませんでした</span>';return;}
      var lc=Array.isArray(found)?found[0]:found;
      el.innerHTML='<span class="ok">✔ '+foundName+'</span> | lcNo: '+(lc.lcNo||lc.lc_no||'-')+' / lcDate: '+(lc.lcDate||lc.lc_date||'-');
    }catch(e){el.innerHTML='<span class="danger">✖ '+e.message+'</span>';}
  });
  /* COMPASS メタデータ確認 */
  var metaRunBtn=document.getElementById('meta-run-btn');
  if(metaRunBtn) metaRunBtn.addEventListener('click',async function(){
    var el=document.getElementById('meta-result');
    var copyBtn=document.getElementById('meta-copy-btn');
    el.textContent='実行中…'; copyBtn.style.display='none';
    var DV_API='https://orgde512c6f.crm7.dynamics.com/api/data/v9.2';
    var resultText='';
    async function dvMeta(path){
      var tok=await LEENAI.auth.token('dataverse');
      var res=await fetch(DV_API+'/'+path,{headers:{Authorization:'Bearer '+tok,Accept:'application/json','OData-MaxVersion':'4.0','OData-Version':'4.0'}});
      if(!res.ok) throw new Error(res.status+' '+(await res.text()).slice(0,100));
      return res.json();
    }
    function pad(s,n){s=String(s||'');return s.length>=n?s:s+' '.repeat(n-s.length);}
    function mkTable(hdrs,rows){
      var w=hdrs.map(function(h,i){return Math.max(h.length,Math.max.apply(null,rows.map(function(r){return String(r[i]||'').length;})));});
      var sep='+'+w.map(function(n){return '-'.repeat(n+2);}).join('+')+'+';
      var hdr='|'+hdrs.map(function(h,i){return ' '+pad(h,w[i])+' ';}).join('|')+'|';
      var body=rows.map(function(r){return '|'+r.map(function(c,i){return ' '+pad(c,w[i])+' ';}).join('|')+'|';}).join('\n');
      return sep+'\n'+hdr+'\n'+sep+'\n'+body+'\n'+sep;
    }
    var html='',buyerNameExists=false,rows1=[],rows2=[],rows3=[];
    /* ① フィールド確認 */
    var tgts=[
      {t:'cr49f_buyer',         fs:['cr49f_buyer','cr49f_buyer_name','cr49f_buyer_code']},
      {t:'cr49f_booking',       fs:['crcf9_carrier_code','crcf9_bl_pol_text']},
      {t:'cr49f_sale_contract', fs:['cr49f_terms_conditions_full','cr49f_sale_contract_id']},
      {t:'cr49f_sale_detail',   fs:['cr49f_price_yen','cr49f_item_id']},
      {t:'crcf9_s_i_detail',    fs:['crcf9_price_yen','crcf9_sale_detail_id']},
    ];
    for(var ti=0;ti<tgts.length;ti++){
      var tgt=tgts[ti];
      try{
        var d=await dvMeta("EntityDefinitions(LogicalName='"+tgt.t+"')/Attributes?$select=LogicalName,AttributeType,SourceType");
        var am={};(d.value||[]).forEach(function(a){am[a.LogicalName]=a;});
        tgt.fs.forEach(function(f){
          var a=am[f];
          rows1.push([tgt.t,f,a?'✅':'❌',a?(a.AttributeType||'-'):'-',a&&a.SourceType!=null?String(a.SourceType):'-']);
          if(f==='cr49f_buyer_name'&&a) buyerNameExists=true;
        });
      }catch(e){tgt.fs.forEach(function(f){rows1.push([tgt.t,f,'⚠ERR',e.message.slice(0,40),'-']);});}
    }
    var t1=mkTable(['テーブル','フィールド','存在','AttributeType','SourceType'],rows1);
    html+='<b>① フィールド確認</b><pre style="font-size:11px;overflow-x:auto;background:var(--surface2);padding:8px;border-radius:6px;margin:6px 0">'+t1+'</pre>';
    /* ② テーブル名確認 */
    try{
      var d2=await dvMeta("EntityDefinitions?$select=LogicalName,EntitySetName&$filter=startswith(LogicalName,'crcf9_custom') or startswith(LogicalName,'crcf9_dray')");
      (d2.value||[]).forEach(function(e){rows2.push([e.LogicalName,e.EntitySetName||'-']);});
      if(!rows2.length) rows2.push(['(該当なし)','-']);
    }catch(e){rows2.push(['⚠ERR',e.message.slice(0,60)]);}
    var t2=mkTable(['LogicalName','EntitySetName'],rows2);
    html+='<b>② テーブル名確認</b><pre style="font-size:11px;overflow-x:auto;background:var(--surface2);padding:8px;border-radius:6px;margin:6px 0">'+t2+'</pre>';
    /* ③ cr49f_buyer 実値 */
    if(buyerNameExists){
      try{
        var d3=await dvMeta("cr49f_buyers?$select=cr49f_buyer,cr49f_buyer_name,cr49f_buyer_code&$top=3");
        (d3.value||[]).forEach(function(r){rows3.push([r.cr49f_buyer||'-',r.cr49f_buyer_name||'-',r.cr49f_buyer_code||'-']);});
        if(!rows3.length) rows3.push(['(レコードなし)','-','-']);
      }catch(e){rows3.push(['⚠ERR',e.message.slice(0,60),'-']);}
      var t3=mkTable(['buyer','buyer_name','buyer_code'],rows3);
      html+='<b>③ cr49f_buyer 実値 (top 3)</b><pre style="font-size:11px;overflow-x:auto;background:var(--surface2);padding:8px;border-radius:6px;margin:6px 0">'+t3+'</pre>';
      resultText='① フィールド確認\n'+t1+'\n\n② テーブル名確認\n'+t2+'\n\n③ cr49f_buyer 実値\n'+t3;
    }else{
      html+='<b>③ cr49f_buyer_name</b> <span class="warn">❌ 存在しないためスキップ</span>';
      resultText='① フィールド確認\n'+t1+'\n\n② テーブル名確認\n'+t2+'\n\n③ cr49f_buyer_name ❌ スキップ';
    }
    el.innerHTML=html;
    copyBtn.style.display='';
    copyBtn.onclick=function(){navigator.clipboard.writeText(resultText).then(function(){copyBtn.textContent='✅ コピー済';setTimeout(function(){copyBtn.textContent='結果をコピー';},2000);});};
  });
}
LEENAI.init({
  sys:'Z-05', name:'COMMON TEST', version:'1.7', date:'2026-10-08',
  desc:'LEENAI_COMMON v1 動作確認ページ',
  onReady: startTool
});
</script>
</body>
</html>
