<body>
<div id="app" style="display:none">
  <div class="mp" id="mpRoot">
    <div class="mp-bar">
      <div style="display:flex;align-items:baseline;gap:10px">
        <span class="t1">LEENAI ポータル</span>

      </div>
      <div class="r">

        <label id="mpViewWrap" style="display:none;align-items:center;gap:6px"><span class="muted">表示</span><select id="mpView"></select></label>

    </div>
    <div class="mp-admin" id="mpAdmin" style="display:none"></div>
  </div>
</div>
<script>
/* ══════════════════════════════════════════════════════════════
   MailPortal — 今日のメール (版は下の LEENAI.init だけ)
   - グローバル名は MailPortal 1 つだけ。画面は mount(ルート要素[, {embedded:true}]) で描く — CLEARANCE_COMPASS などに
     タブとして結合するときは、mpRoot の中身と <style> を移して MailPortal.mount(タブの要素) を呼ぶ。
     その TOOL の LEENAI.init に graphScopes:['Mail.ReadWrite','Sites.ReadWrite.All'] を足すこと
   - イベントはルート要素の中だけで受ける (結合先の document のクリック処理と干渉しない)
   - 判定エンジン MAIL_ENGINE が SharePoint リスト MAIL_TASKS に書いた「やること」を表示する
   - メールボックスへの書き込みは「フラグ (flag) の変更」だけ。移動・削除・送信・既読化はしない
   - 本文プレビュー (v0.10) は開くたびに本人のメールボックスから GET するだけ (保存しない・既読にしない)
   - 管理者かどうかは共通マスター staff の portal_admin だけで判断 (名前・アドレスをコードに書かない)
   ✦ Powered by LEENAI Automation System
══════════════════════════════════════════════════════════════ */
var MailPortal=(function(){
'use strict';
var ROOT=null;
function $(id){return ROOT.querySelector('#'+id);}
var GRAPH='https://graph.microsoft.com/v1.0';
var SITE_PATH='leenear.sharepoint.com:/sites/leenearsite1';
var LIST={T:'MAIL_TASKS',A:'MAIL_TASKS_ARCHIVE',L:'MAIL_REASSIGN_LOG'};
var REFRESH_MS=60000;
var OVER_LIMIT=100;   // 担当者 1 人の未完了がこれを超えたら強調 (DOC-MAIL-01 §2-12)
var COL={R:{label:'処理',order:'古い順'},Y:{label:'情報',order:'新しい順'},G:{label:'要約',order:'新しい順'}};
var COL_RANK={R:0,Y:1,G:2};
/* 相手の種類 — エンジンが書く PartyType (基準実装 party_type の値) の表示名 */
var PARTY_JA={'선사':'船社','공컨테이너·터미널':'空コン·ターミナル','乙仲·통관':'乙仲·通関','드레이':'ドレー','검사기관':'検査機関',
  '보험':'保険','판매처·에이전트':'販売先·エージェント','매입처·Packer':'仕入先·Packer','청구·정산 시스템':'請求·精算システム',
  '기관·공공':'機関·公共','택배·기타 서비스':'宅配·その他','사내':'社内'};
var REASONS=['担当違い','一時代理','その他'];
/* 役割 — エンジンが書く Role (基準実装 build_tasks の値) の表示名。変更・引受 はポータルが書く日本語 */
var ROLE_JA={'주':'主','참고':'参考','R0':'R0','미판정':'未判定','To':'宛先'};   // To = R1 (宛先の職員 1 名, エンジン v1.4)
function roleJa(r){return ROLE_JA[r]||r||'';}

var S={site:null,lists:{},staff:{},order:[],me:null,view:null,tab:'open',filter:'ALL',sel:{},confirming:false,
  reassign:null,target:'',reason:'担当違い',open:[],und:[],done:[],adminOpen:[],log:[],updatedAt:null,busy:false,adminMode:false,timer:null};

/* ── Graph / SharePoint ── */
async function tok(){var t=await LEENAI.auth.token('graph');if(!t)throw new Error('Graph トークンがありません (再ログインしてください)');return t;}
async function gx(method,url,body,hdr){
  var h=Object.assign({Authorization:'Bearer '+(await tok())},hdr||{});
  if(body!==undefined) h['Content-Type']='application/json';
  var r=await fetch(url.indexOf('http')===0?url:GRAPH+url,{method:method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  if(r.status===412){var e=new Error('412');e.status=412;throw e;}
  if(!r.ok){var t='';try{t=await r.text();}catch(_){} var e2=new Error(method+' '+r.status+' '+t.slice(0,160));e2.status=r.status;throw e2;}
  if(r.status===204) return {};
  try{return await r.json();}catch(_){return {};}
}
async function gall(url,hdr){var out=[];while(url){var d=await gx('GET',url,undefined,hdr);out=out.concat(d.value||[]);url=d['@odata.nextLink']||null;}return out;}
function q(v){return "'"+String(v==null?'':v).replace(/'/g,"''")+"'";}
function itemsUrl(k){return '/sites/'+S.site+'/lists/'+S.lists[k]+'/items';}
async function query(k,flt,extra){
  var url=itemsUrl(k)+'?$expand=fields&$top=999&$filter='+encodeURIComponent(flt)+(extra||'');
  var hdr={Prefer:'HonorNonIndexedQueriesWarningMayFailRandomly'};
  return (await gall(url,hdr)).map(function(it){return {id:it.id,etag:it['@odata.etag']||it.eTag||'',list:k,f:it.fields||{}};});
}
async function patchItem(row,fields,useEtag){
  var hdr=useEtag&&row.etag?{'If-Match':row.etag}:{};
  return gx('PATCH',itemsUrl(row.list)+'/'+row.id+'/fields',fields,hdr);
}
/* eTag 付きで保存。412 (版が変わった) なら読み直し、still(現在の値) が真なら新しい eTag でもう一度 —
   フラグ保存などで版だけ変わった場合は続行し、他の人が担当・状態を変えた本当の衝突だけ止める */
async function patchGuarded(row,fields,still){
  try{return await patchItem(row,fields,true);}
  catch(e){
    if(e.status!==412) throw e;
    var cur=await gx('GET',itemsUrl(row.list)+'/'+row.id+'?$expand=fields');
    row.etag=cur['@odata.etag']||cur.eTag||row.etag;
    if(!still(cur.fields||{})){var e2=new Error('412');e2.status=412;e2.current=cur.fields||{};throw e2;}
    row.f=cur.fields||row.f;
    return await patchItem(row,fields,true);
  }
}
async function addLog(fields){return gx('POST',itemsUrl('L'),{fields:fields});}

/* ── Outlook (本人のメールボックス) — 書き込みは flag だけ ── */
async function findMail(imid){
  var d=await gx('GET','/me/messages?$filter='+encodeURIComponent('internetMessageId eq '+q(imid))+'&$select=id,webLink,flag&$top=1');
  return (d.value||[])[0]||null;
}
async function setOutlookFlag(imid,status){   // status: flagged | complete | notFlagged
  var m=await findMail(imid);
  if(!m) return false;
  await gx('PATCH','/me/messages/'+m.id,{flag:{flagStatus:status}});
  return true;
}
async function openInOutlook(imid){
  var w=window.open('about:blank','_blank');
  try{
    var m=await findMail(imid);
    if(!m||!m.webLink){if(w)w.close();LEENAI.toast('Outlook にこのメールが見つかりません','warn');return;}
    if(w) w.location.href=m.webLink; else window.open(m.webLink,'_blank');
  }catch(e){if(w)w.close();LEENAI.toast('Outlook を開けません: '+e.message,'danger');}
}

/* ── 表示用 ── */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nm(code){return code==='UNDECIDED'?'未判定':((S.staff[code]||{}).name||code||'—');}
function pad(n){return (n<10?'0':'')+n;}
function fmtTime(iso,now){
  if(!iso) return '';
  var d=new Date(iso),n=now||new Date();
  var hm=d.getHours()+':'+pad(d.getMinutes());
  var day=function(x){return x.getFullYear()+'-'+x.getMonth()+'-'+x.getDate();};
  if(day(d)===day(n)) return hm;
  var y=new Date(n.getTime()-86400000);
  if(day(d)===day(y)) return '昨日 '+hm;
  return (d.getMonth()+1)+'/'+d.getDate()+' '+hm;
}
function keyOf(f){
  var a=[];if(f.Pol)a.push(f.Pol);if(f.InvoiceNo)a.push('IV '+f.InvoiceNo);
  return a.length?a.join(' · '):'—';
}
function domainOf(a){a=String(a||'');return a.indexOf('@')>=0?a.split('@').pop().toLowerCase():'';}
function partyJa(f){var p=f.PartyType||'';return p?(PARTY_JA[p]||p):'不明 ('+domainOf(f.FromAddress)+')';}
function todayStartIso(){var d=new Date();d.setHours(0,0,0,0);return d.toISOString();}
function isAdmin(){return !!(S.me&&S.me.admin);}
function canAct(){return S.view===S.me.code;}
function canReassign(){return S.view!=='ALL'&&(S.view===S.me.code||isAdmin());}

/* ── 読み込み ── */
async function loadMasters(){
  var items=await LEENAI.master.get('staff',{fresh:true});
  S.staff={};S.order=[];
  (items||[]).forEach(function(r){
    if(!r.code) return;
    S.staff[r.code]={name:r.name_ja||r.name_en||r.code,email:String(r.email||'').toLowerCase(),active:r.active!==false&&r.active!=='false',
      admin:r.portal_admin===true||r.portal_admin==='true'};
    S.order.push(r.code);
  });
  var email=String((LEENAI.user||{}).email||'').toLowerCase();
  var code=S.order.find(function(c){return S.staff[c].email===email;});
  if(!code) throw new Error('職員マスターにこのアカウント ('+email+') がありません');
  S.me={code:code,name:S.staff[code].name,admin:S.staff[code].admin};
  if(!S.view) S.view=S.me.admin?'ALL':code;
  if(!S.me.admin) S.view=code;   // 一般職員は本人のみ
}
async function resolveSite(){
  if(S.site) return;
  S.site=(await gx('GET','/sites/'+SITE_PATH+'?$select=id')).id;
  (await gall('/sites/'+S.site+'/lists?$select=id,displayName')).forEach(function(l){
    Object.keys(LIST).forEach(function(k){if(l.displayName===LIST[k])S.lists[k]=l.id;});
  });
  ['T','A','L'].forEach(function(k){if(!S.lists[k])throw new Error('SharePoint リスト '+LIST[k]+' がありません');});
}
async function loadData(){
  var v=S.view, t0=todayStartIso();
  var jobs=[];
  if(v==='ALL') jobs.push(query('T',"fields/Status eq 'OPEN'"));
  else jobs.push(query('T',"fields/StaffCode eq "+q(v)+" and fields/Status eq 'OPEN'"));
  jobs.push(query('T',"fields/StaffCode eq 'UNDECIDED' and fields/Status eq 'OPEN'"));
  if(v!=='ALL'){
    jobs.push(query('T',"fields/StaffCode eq "+q(v)+" and fields/Status eq 'DONE'"));
    jobs.push(query('A',"fields/StaffCode eq "+q(v)+" and fields/CompletedAt ge "+q(t0)));
  }
  var r=await Promise.all(jobs);
  S.open=r[0].filter(function(x){return x.f.StaffCode!=='UNDECIDED';});
  S.und=r[1];
  S.done=v==='ALL'?[]:r[2].concat(r[3].filter(function(x){return x.f.Status==='DONE'&&(x.f.CompletedAt||'')>=t0;}));
  if(isAdmin()&&S.adminMode){
    var a=await Promise.all([v==='ALL'?Promise.resolve(r[0]):query('T',"fields/Status eq 'OPEN'"),
      gall(itemsUrl('L')+'?$expand=fields&$top=999')]);
    S.adminOpen=a[0];
    S.log=a[1].map(function(it){return it.fields||{};}).sort(function(x,y){return (y.At||'')>(x.At||'')?1:(y.At||'')<(x.At||'')?-1:0;}).slice(0,50);
  }
  // 選択・開いたパネルは、まだ存在する行のぶんだけ残す
  var ids={};S.open.forEach(function(x){ids[x.id]=1;});
  Object.keys(S.sel).forEach(function(id){if(!ids[id])delete S.sel[id];});
  if(S.reassign&&!ids[S.reassign]) S.reassign=null;
  S.updatedAt=new Date();
}
async function refresh(quiet){
  if(S.busy) return;
  S.busy=true;
  try{await loadData();render();}
  catch(e){if(!quiet)LEENAI.toast('読み込みエラー: '+e.message,'danger');}
  finally{S.busy=false;}
}

function groupByMail(rows){
  var m={},out=[];
  rows.forEach(function(x){
    var k=x.f.InternetMessageId||x.id;
    if(!m[k]){m[k]={id:'M:'+k,f:x.f,rows:[],c:x.f.Color};out.push(m[k]);}
    m[k].rows.push(x);
    if(COL_RANK[x.f.Color]<COL_RANK[m[k].c]) m[k].c=x.f.Color;   // いちばん急ぐ色
  });
  out.forEach(function(g){g.f=Object.assign({},g.f,{Color:g.c});});
  return out;
}
function visibleRows(){
  var base=S.view==='ALL'?groupByMail(S.open):S.open;
  return base.filter(function(x){return S.filter==='ALL'||x.f.Color===S.filter;});
}
function grouped(rows){
  return ['R','Y','G'].map(function(c){
    var rs=rows.filter(function(x){return x.f.Color===c;}).sort(function(a,b){
      var A=a.f.ReceivedAt||'',B=b.f.ReceivedAt||'';return c==='R'?(A<B?-1:A>B?1:0):(A>B?-1:A<B?1:0);});
    return {c:c,rows:rs};
  }).filter(function(g){return g.rows.length;});
}
function countsOf(rows){var n={ALL:rows.length,R:0,Y:0,G:0};rows.forEach(function(x){n[x.f.Color]=(n[x.f.Color]||0)+1;});return n;}

function rowById(id){return S.open.find(function(x){return x.id===id;});}
async function doFlag(ids){
  var errs=0;
  for(var i=0;i<ids.length;i++){
    var x=rowById(ids[i]);if(!x)continue;
    var on=!x.f.Flagged;
    try{
      var found=await setOutlookFlag(x.f.InternetMessageId,on?'flagged':'notFlagged');
      if(!found) LEENAI.toast('Outlook にこのメールが見つかりません (リストのフラグのみ変更)','warn');
      await patchItem(x,{Flagged:on});
      x.f.Flagged=on;
    }catch(e){errs++;}
  }
  if(errs) LEENAI.toast(errs+'件 フラグを変更できませんでした','danger');
  render();
  await refresh(true);
}
async function flagSelected(){
  var ids=visibleRows().filter(function(x){return S.sel[x.id]&&!x.f.Flagged;}).map(function(x){return x.id;});
  S.sel={};await doFlag(ids);
}
/* 完了の本体 — 一括 (completeSelected) とプレビューの「完了」で同じ保存 (v0.10 で切り出しただけ) */
async function completeIds(ids){
  var now=new Date().toISOString(),errs=[];
  for(var i=0;i<ids.length;i++){
    var x=rowById(ids[i]);if(!x)continue;
    try{
      if(x.f.Flagged){try{await setOutlookFlag(x.f.InternetMessageId,'complete');}catch(e){}}
      await patchGuarded(x,{Status:'DONE',CompletedAt:now,CompletedBy:S.me.code},function(c){return c.StaffCode===x.f.StaffCode&&c.Status==='OPEN';});

/* 移す先が同じメールの行をもう持っていれば、新しく作らず元の行だけ片付ける (削除 — 記録はログに残る) */

/* ══ メール本文プレビュー (v0.10) — 行を押すと右半分 (今日の作業 の上) に本文。閉じると今日の作業に戻る
   - 本文は保存しない: 開くたびに本人のメールボックス (/me/messages) を GET (メモリ内に最近 30 通だけ)。既読にしない
   - 本文 HTML はポータルの DOM に入れず、sandbox iframe (スクリプト・同一オリジン・フォーム不可) の srcdoc だけ
   - 外部画像は既定で読まない (CSP)。「外部画像を表示」でそのメールだけ https: を許可
   - render()・renderWork() はこの要素を描き直さない (60 秒更新で閉じたり iframe が読み直されたりしない) ══ */
var PV_CACHE_MAX=30;
var PV_CSP="default-src 'none'; img-src data: cid:; style-src 'unsafe-inline'";
var PV={kind:'',id:'',f:null,msg:null,state:'',err:'',ext:false,gone:false,busy:false,doc:'',cache:new Map(),el:null};
function pvIs(kind,id){return PV.kind===kind&&PV.id===id;}
function undSorted(){return S.und.slice().sort(function(a,b){return (b.f.ReceivedAt||'')>(a.f.ReceivedAt||'')?1:-1;});}
function doneSorted(){return S.done.slice().sort(function(a,b){return (b.f.CompletedAt||'')>(a.f.CompletedAt||'')?1:-1;});}
function pvId(kind,x){return kind==='D'?x.list+':'+x.id:x.id;}
/* 画面と同じ並び (未完了 = 色の区域ごと・絞り込み後 / 未判定 / 今日完了) */
function pvList(kind){
  if(kind==='O'){var out=[];grouped(visibleRows()).forEach(function(g){out=out.concat(g.rows);});return out;}
  return kind==='U'?undSorted():doneSorted();
}
function pvFind(kind,id){
  var rows=kind==='O'?(S.view==='ALL'?groupByMail(S.open):S.open):kind==='U'?S.und:S.done;
  return rows.find(function(x){return pvId(kind,x)===id;})||null;
}
function pvRowEl(kind,id){
  var p=$('mpPanel');if(!p) return null;
  return Array.prototype.find.call(p.querySelectorAll('[data-pv]'),function(r){return r.getAttribute('data-pv')===kind&&r.getAttribute('data-id')===id;})||null;
}
function pvMark(){
  var p=$('mpPanel');if(!p) return;
  Array.prototype.forEach.call(p.querySelectorAll('[data-pv]'),function(r){r.classList.toggle('pv',pvIs(r.getAttribute('data-pv'),r.getAttribute('data-id')));});
}
function pvEnsure(){
  if(PV.el) return;
  var p=$('mpPv');
  p.innerHTML='<div class="mp-pv-head" id="mpPvHead"></div><div class="mp-pv-frame"><div class="mp-pv-msg" id="mpPvMsg"></div><iframe id="mpPvFrame" style="display:none"></iframe></div>';
  PV.el=p;
  pvFrame('');
}
/* 表示するメールが変わるときだけ iframe を作り直す — sandbox・srcdoc を付けてから入れるので読み込みは 1 回だけ
   (同じ iframe の srcdoc を続けて書き換えると、ブラウザによっては空白のままになるため)。更新 (render) では触らない */
function pvFrame(doc){
  var old=$('mpPvFrame'),fr=document.createElement('iframe');
  fr.setAttribute('sandbox','allow-popups allow-popups-to-escape-sandbox');   // allow-scripts・allow-same-origin・allow-forms は入れない
  fr.setAttribute('referrerpolicy','no-referrer');
  fr.id='mpPvFrame';fr.title='メール本文';
  if(doc) fr.setAttribute('srcdoc',doc); else fr.style.display='none';
  old.parentNode.replaceChild(fr,old);
}
function pvOpen(kind,id){
  var x=pvFind(kind,id);if(!x) return;
  pvEnsure();
  PV.kind=kind;PV.id=id;PV.f=x.f;PV.msg=null;PV.state='';PV.err='';PV.ext=false;PV.gone=false;
  $('mpWork').style.display='none';PV.el.style.display='flex';
  pvMark();pvHead();pvLoad();
}
function pvClose(){
  if(!PV.kind) return;
  PV.kind='';PV.id='';PV.f=null;PV.msg=null;PV.state='';PV.doc='';
  if(PV.el){pvFrame('');PV.el.style.display='none';}
  $('mpWork').style.display='';
  pvMark();
}
function pvToggle(kind,id){if(pvIs(kind,id))pvClose();else pvOpen(kind,id);}
function pvStep(d){
  var list=pvList(PV.kind),i=list.findIndex(function(x){return pvId(PV.kind,x)===PV.id;}),j=i<0?0:i+d;
  if(j<0||j>=list.length) return;
  pvOpen(PV.kind,pvId(PV.kind,list[j]));
  var r=pvRowEl(PV.kind,PV.id);if(r&&r.scrollIntoView)r.scrollIntoView({block:'nearest'});
}
/* 更新 (60 秒・操作後) のたびに: 行がまだあるか・フラグなどを見出しにだけ反映 (iframe はそのまま) */
function pvSync(){
  if(!PV.kind) return;

  PV.gone=!x;if(x)PV.f=x.f;
  pvHead();
}
/* findMail と同じ探し方で、本文・宛先・添付の名前と大きさまで 1 回で (添付の中身は読まない) */
async function pvFetch(imid){
  var url='/me/messages?$filter='+encodeURIComponent('internetMessageId eq '+q(imid))
    +'&$select=id,webLink,subject,from,toRecipients,ccRecipients,receivedDateTime,body,hasAttachments&$top=1';
  var hdr={Prefer:'outlook.body-content-type="html"'},d,m;
  try{d=await gx('GET',url+'&$expand='+encodeURIComponent('attachments($select=name,size,isInline,contentType)'),undefined,hdr);m=(d.value||[])[0]||null;}
  catch(e){
    if(e.status!==400) throw e;   // $expand が使えないときだけ添付を別に
    d=await gx('GET',url,undefined,hdr);m=(d.value||[])[0]||null;
    if(m) m.attachments=m.hasAttachments?await gall('/me/messages/'+m.id+'/attachments?$select=name,size,isInline,contentType'):[];
  }
  return m;
}
async function pvLoad(){
  var kind=PV.kind,id=PV.id,imid=(PV.f||{}).InternetMessageId;
  if(!imid){PV.state='none';pvHead();pvBody();return;}
  if(PV.cache.has(imid)){var c=PV.cache.get(imid);PV.cache.delete(imid);PV.cache.set(imid,c);PV.msg=c;PV.state='ok';pvHead();pvBody();return;}
  PV.state='loading';pvBody();
  try{
    var m=await pvFetch(imid);
    if(m){PV.cache.set(imid,m);while(PV.cache.size>PV_CACHE_MAX)PV.cache.delete(PV.cache.keys().next().value);}
    if(!pvIs(kind,id)) return;   // 読み込み中に別の行へ移った
    PV.msg=m;PV.state=m?'ok':'none';
  }catch(e){
    if(!pvIs(kind,id)) return;
    PV.state='err';PV.err=e.message;
  }
  pvHead();pvBody();
}
function pvDoc(m,ext){
  var b=m.body||{},html=String(b.content||'');
  if(String(b.contentType||'').toLowerCase()!=='html') html='<pre style="white-space:pre-wrap;word-break:break-word;font-family:inherit;margin:0">'+esc(html)+'</pre>';
  else html=html.replace(/<meta[^>]*http-equiv\s*=\s*["']?refresh[^>]*>/gi,'');   // 自動で別ページへ移る指定は外す
  return '<meta http-equiv="Content-Security-Policy" content="'+(ext?PV_CSP.replace('img-src data: cid:','img-src data: https:'):PV_CSP)+'">'
    +'<meta charset="utf-8"><base target="_blank">'
    +'<style>html,body{background:#FFFFFF;color:#000000}body{margin:12px;font-family:"Segoe UI","Yu Gothic UI","Meiryo",sans-serif;font-size:14px}</style>'+html;
}
function pvBody(){
  var box=$('mpPvMsg');if(!box||!$('mpPvFrame')) return;
  if(PV.state==='ok'){
    var doc=pvDoc(PV.msg,PV.ext);
    box.style.display='none';
    if(PV.doc!==doc){PV.doc=doc;pvFrame(doc);}
    return;
  }
  if(PV.doc){PV.doc='';pvFrame('');}
  box.style.display='';
  box.innerHTML=PV.state==='loading'?'読み込み中…'
    :PV.state==='none'?'Outlook にこのメールが見つかりません (削除・移動された可能性)'
    :'読み込めません: '+esc(PV.err)+'<br><button class="mp-btn" data-act="pvreload" style="margin-top:8px">再読み込み</button>';
}
function pvPeople(list){
  var ns=(list||[]).map(function(r){var a=r.emailAddress||{};return a.name||a.address||'';}).filter(Boolean);
  var all=(list||[]).map(function(r){var a=r.emailAddress||{};return (a.name?a.name+' ':'')+'<'+(a.address||'')+'>';}).join(', ');
  return '<span title="'+esc(all)+'">'+esc(ns.slice(0,3).join(', '))+(ns.length>3?' 他 '+(ns.length-3)+' 名':'')+'</span>';
}
function fmtSize(n){n=+n||0;return n<1024?n+' B':n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB';}
function pvHead(){
  var hd=$('mpPvHead');if(!hd||!PV.kind) return;

  h+='<div><a class="mp-pv-subj" data-act="outlook" data-imid="'+im+'" title="Outlook で開く">'+esc((m?m.subject:f.Subject)||'(件名なし)')+'</a></div>';

    if(at.length) h+='<div class="mp-pv-meta">添付: '+at.map(function(a){return '<a data-act="outlook" data-imid="'+im+'" title="Outlook で開く">'+esc(a.name)+'</a> ('+fmtSize(a.size)+')';}).join(' · ')+'</div>';

      +'<button class="mp-btn" data-act="pvimg"'+(PV.ext||PV.state!=='ok'?' disabled':'')+'>'+(PV.ext?'外部画像を表示中':'外部画像を表示')+'</button>';

/* その場で「完了」— 確認なし (1 通・本人が押した・当日は戻せる)。終わったら同じ並びの次の行へ、なければ閉じる */
async function pvDone(){
  if(PV.kind!=='O'||!canAct()||PV.gone||PV.busy) return;
  var id=PV.id,list=pvList('O'),i=list.findIndex(function(x){return x.id===id;}),next=i>=0&&list[i+1]?list[i+1].id:'';
  PV.busy=true;pvHead();

  else LEENAI.toast('完了にしました (今日完了から戻せます)','ok');
  await refresh(true);
  if(!pvIs('O',id)){pvHead();return;}
  if(errs.length){pvSync();return;}
  if(next&&pvFind('O',next)){pvOpen('O',next);var r=pvRowEl('O',next);if(r&&r.scrollIntoView)r.scrollIntoView({block:'nearest'});}

function shown(){for(var n=ROOT;n&&n.nodeType===1;n=n.parentElement){if(n.style&&n.style.display==='none')return false;}return !!ROOT&&ROOT.isConnected;}
function onKey(e){
  if(!PV.kind||!shown()) return;
  var t=e.target,tg=(t&&t.tagName)||'';
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(tg)||(t&&t.isContentEditable)) return;   // 入力中は動かない
  if(e.key==='Escape'){pvClose();}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();pvStep(e.key==='ArrowDown'?1:-1);}
}

/* ── イベント (委任) ── */
function onClick(e){

  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v'),id=el.getAttribute('data-id');
  if(a==='tab'){S.tab=v;S.confirming=false;render();}
  else if(a==='filter'){S.filter=v;S.sel={};S.confirming=false;render();}
  else if(a==='flag'){doFlag([id]);}
  else if(a==='flagsel'){flagSelected();}
  else if(a==='askdone'){if(Object.keys(S.sel).some(function(k){return S.sel[k];})){S.confirming=true;render();}}
  else if(a==='canceldone'){S.confirming=false;render();}
  else if(a==='dodone'){completeSelected();}
  else if(a==='outlook'){e.preventDefault();openInOutlook(el.getAttribute('data-imid'));}
  else if(a==='rsopen'){S.reassign=S.reassign===id?null:id;render();}
  else if(a==='rscancel'){S.reassign=null;render();}
  else if(a==='reason'){S.reason=v;render();}
  else if(a==='rsdo'){doReassign(id);}
  else if(a==='take'){take(id);}
  else if(a==='restore'){restore(id);}
  else if(a==='wkfold'){W.open[v]=W.open[v]===false;renderWork();}
  else if(a==='pvclose'){pvClose();}
  else if(a==='pvdone'){pvDone();}
  else if(a==='pvimg'){PV.ext=true;pvHead();pvBody();}
  else if(a==='pvreload'){if(PV.f)PV.cache.delete(PV.f.InternetMessageId);pvLoad();}
  else if(a==='adminpick'){S.view=v;S.adminMode=false;S.tab='open';S.filter='R';S.sel={};refresh();}
}
function onChange(e){
  var el=e.target,a=el.getAttribute('data-act');

  else if(a==='target'){S.target=el.value;}
}

/* CLEARANCE_COMPASS nextBizDay と同じ (土日を飛ばす) */

  var n=new Date(now.getTime()),add=function(k){var d=new Date(n.getTime());d.setDate(d.getDate()+k);return d;};
  var nb=add(1);while(nb.getDay()===0||nb.getDay()===6)nb.setDate(nb.getDate()+1);
  return {T:ymd(n),NB:ymd(nb),M7:ymd(add(-7)),M30:ymd(add(-30)),M90:ymd(add(-90)),P180:ymd(add(180)),S180:ymd(add(-WK_SI_DAYS))};
}
function d10(s){return s?String(s).slice(0,10):'';}
function fmtD(s){s=d10(s);return s?s.slice(5).replace('-','/'):'—';}

/* POL 担当 — CLEARANCE_COMPASS getStaff と同じ (POL 文字列に含まれる → なければ「*」の行)。補助も一緒に見る */
function wkPolOwners(pol,polRows){
  var up=String(pol||'').toUpperCase(),hit=null;
  if(up&&up!=='—') polRows.forEach(function(r){if(!hit&&r.pol&&r.pol!=='*'&&up.indexOf(String(r.pol).toUpperCase())>=0)hit=r;});
  if(!hit) hit=polRows.find(function(r){return r.pol==='*';});
  return hit?[hit.staff,hit.assist].filter(Boolean):[];
}
/* 書類担当 — CLEARANCE_COMPASS getShipStaff (IV 先頭 1 文字を除き長いコード優先・直後が数字) → なければ販売先名:
   ① 輸入者名と一致 (getBuyerStaff) ② 輸入者名 (4 文字以上) が販売先名に含まれる — エンジン MAIL_ENGINE と同じ (v0.6)。担当が 1 人に決まるときだけ */
function wkDocOwner(iv,buyer,docRows){
  var body=String(iv||'').trim().toUpperCase().slice(1);
  var rows=docRows.filter(function(r){return r.iv_code;}).sort(function(a,b){return b.iv_code.length-a.iv_code.length;});
  for(var i=0;i<rows.length;i++){var k=String(rows[i].iv_code).toUpperCase();
    if(body.indexOf(k)===0&&/\d/.test(body.charAt(k.length)||''))return rows[i].staff||'';}
  var nk=function(t){return String(t||'').replace(/[\s　]+/g,'').toUpperCase();},b=nk(buyer);
  if(!b) return '';
  var same=docRows.filter(function(x){return x.staff&&nk(x.importer)===b;});
  if(!same.length) same=docRows.filter(function(x){var k=nk(x.importer);return x.staff&&k.length>=4&&b.indexOf(k)>=0;});
  var st={};same.forEach(function(x){st[x.staff]=1;});
  var ks=Object.keys(st);
  return ks.length===1?ks[0]:'';
}

/* 契約番号のコード — LRS-2611SG1 → SG (英字-年月 4 桁 + コード + 連番, IV コードと同じ体系) → 書類担当マスター (v0.7) */
function wkContractOwner(no,docRows){
  var m=String(no||'').trim().match(/^[A-Z]+-\d{4}([A-Z]{1,3})\d*$/i);
  if(!m) return '';
  var r=docRows.find(function(x){return x.staff&&String(x.iv_code||'').toUpperCase()===m[1].toUpperCase();});
  return r?r.staff:'';
}

/* 条件 (形님 確定 2026-10-20) — raw は COMPASS・状態 JSON を読んだまま。判定だけをするので日付を変えて試験できる */
function buildWork(raw,now,polRows,docRows){
  var D=wkDates(now),rows=[],st=raw.status||{},rec=st.records||{},shp=st.shipping||{},cot=st.cotecna||{};
  var sp=function(iv){return shp[iv]||{dep:'未',furikomi:'未',fd_date:''};};
  var isL=function(iv){return /^L/i.test(String(iv||'').trim());};
  var pol=function(b){var p=(raw.pol||{})[b._cr49f_region_japan_id_value]||(b.crcf9_delivery_location?String(b.crcf9_delivery_location).replace(/ CY$| PORT$/,''):'');return String(p||'').replace(', JAPAN','').trim()||'—';};
  // 通関: CUT が今日または次の営業日 かつ 通関依頼 未
  (raw.cut||[]).forEach(function(b){
    var c=d10(b.cr49f_cy_cut),iv=b.cr49f_invoice_no||'—';
    if(c!==D.T&&c!==D.NB) return;
    if((rec[iv]||{}).tsukan_irai) return;
    var p=pol(b);
    rows.push({sec:'tsukan',date:c,red:c===D.T,owners:wkPolOwners(p,polRows),iv:iv,a:p,b:b.cr49f_booking_no||'—',
      c:'CT '+((raw.ctCount||{})[b.cr49f_bookingid]||'—'),d:'CUT '+fmtD(c),st:'通関依頼 未',st2:(raw.siSet||{})[b._cr49f_sale_contract_id_value]?'S/I 済':'S/I 未'});
  });
  // 検査: 検査ありコンテナを iv|vo|partial で束ね、作業日に今日または次の営業日があるもの
  var grp={};
  (raw.insp||[]).forEach(function(c){
    var b=(raw.inspBk||{})[c._crcf9_booking_id_value]||{};
    var rv=(raw.vo||{})[b._cr49f_sale_contract_id_value]||'',m=String(rv).match(/(\d+\.\d+)/);
    var vo=m?'X.'+m[1]:(rv||'—'),iv=b.cr49f_invoice_no||'—',pt=c.crcf9_partial_no||'—',key=iv+'|'+vo+'|'+pt;
    var g=grp[key]||(grp[key]={key:key,iv:iv,vo:vo,pt:pt,dates:[],n:0,pol:pol(b),place:'—'});
    var wd=d10(c.crcf9_work_date);if(wd&&g.dates.indexOf(wd)<0)g.dates.push(wd);
    g.n++;var pl=(raw.place||{})[c._crcf9_purchase_contract_id_value];if(g.place==='—'&&pl)g.place=pl;
  });
  Object.keys(grp).forEach(function(k){
    var g=grp[k];if(g.dates.indexOf(D.T)<0&&g.dates.indexOf(D.NB)<0) return;
    g.dates.sort();var day=g.dates.indexOf(D.T)>=0?D.T:D.NB;
    rows.push({sec:'insp',date:day,red:day===D.T,owners:wkPolOwners(g.pol,polRows),iv:g.iv,a:g.place,b:'CT '+g.n,c:g.vo+(g.pt!=='—'?'-'+g.pt:''),
      d:'作業 '+(g.dates.length>1?fmtD(g.dates[0])+'〜'+fmtD(g.dates[g.dates.length-1]):fmtD(day)),st:'報告 '+((cot[k]||{}).report_status||'未')});
  });
  // 書類 ①②③ (CLEARANCE_COMPASS 船積書類と同じ ETD −90〜+180 の Booking から, IV「L」= 国内転売は除外)
  (raw.ship||[]).forEach(function(b){
    var iv=b.cr49f_invoice_no||'';if(!iv||isL(iv)) return;
    var s=sp(iv),buyer=(raw.buyerOfContract||{})[b._cr49f_sale_contract_id_value]||'',own=wkDocOwner(iv,buyer,docRows);
    var owners=own?[own]:[],imp=raw.importer?raw.importer(iv):'',cut=d10(b.cr49f_cy_cut),bl=d10(b.crcf9_bl_etd);
    var base={owners:owners,iv:iv,a:buyer||imp||'—',b:b.cr49f_booking_no||'—'};
    if(bl&&bl<=D.T&&!String(s.fd_date||'').trim())
      rows.push(Object.assign({sec:'d1',date:bl,red:bl===D.T,c:'B/L '+fmtD(bl),d:'',st:'FD送付日 未入力'},base));
    if(cut&&cut<D.T&&cut>=D.M30){
      if(String((raw.region||{})[b._cr49f_region_id_value]||'').toUpperCase().indexOf('VIETNAM')>=0&&(s.dep||'未')==='未')
        rows.push(Object.assign({sec:'d2',date:cut,red:false,c:'CUT '+fmtD(cut),d:'',st:'DEP 未'},base));
      if((s.furikomi||'未')==='未')
        rows.push(Object.assign({sec:'d3',date:cut,red:false,c:(raw.carrier||{})[b._cr49f_carrier_id_value]||'—',d:'CUT '+fmtD(cut),st:'振込 未'},base));
    }
  });
  // 書類 ④: 契約日が最近 180 日・S/I がない販売契約 (Booking の IV コード → 契約番号のコード → 販売先名 → 決まらなければ全員)
  (raw.contracts||[]).forEach(function(c){
    var dt=d10(c.cr49f_sale_contract_date);if(!dt||dt<D.S180) return;
    if(/^LS/i.test(String(c.cr49f_sale_contract_no||'').trim())) return;   // 契約「LS」始まり = 国内販売 → 書類の対象外 (v0.6)
    if((raw.siSet||{})[c.cr49f_sale_contractid]) return;
    var ivs=(raw.ivsOfContract||{})[c.cr49f_sale_contractid]||[],buyer=(raw.buyerName||{})[c._cr49f_buyer_id_value]||'',codes={};
    ivs.forEach(function(iv){var o=wkDocOwner(iv,'',docRows);if(o)codes[o]=1;});
    var ks=Object.keys(codes);
    if(!ks.length){var cc=wkContractOwner(c.cr49f_sale_contract_no,docRows);if(cc)ks=[cc];}   // v0.7 — LRS-2611SG1 → SG
    if(!ks.length){var o=wkDocOwner('',buyer,docRows);if(o)ks=[o];}
    var und=ks.length!==1;
    rows.push({sec:'d4',date:dt,red:false,owners:und?[]:ks,undecided:und,iv:c.cr49f_sale_contract_no||'—',a:buyer||'—',b:'',c:'契約 '+fmtD(dt),d:'',st:'S/I 未'});
  });
  rows.sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:0;});   // 各区域とも古い順
  return rows;
}

/* 見る人ごと — POL 担当なら 通関・検査、書類担当なら 書類 ①〜④ (両方なら両方)。全員 = すべて (行ごとに担当名) */
function workView(view,rows,polRows,docRows){
  var isPol=view==='ALL'||polRows.some(function(r){return r.staff===view||r.assist===view;});
  var isDoc=view==='ALL'||docRows.some(function(r){return r.staff===view;});
  return WK_SEC.map(function(s){
    var mine=rows.filter(function(r){return r.sec===s.k&&(view==='ALL'||r.owners.indexOf(view)>=0||(s.k==='d4'&&r.undecided));});
    var show=(s.kind==='pol'?isPol:isDoc)||(s.k==='d4'&&mine.length>0);
    return {sec:s,rows:show?mine:[],show:show};
  }).filter(function(x){return x.show;});
}

async function dvUrl(url){
  var t=await LEENAI.auth.token('dataverse');
  var r=await fetch(url,{headers:{Authorization:'Bearer '+t,'OData-MaxVersion':'4.0','OData-Version':'4.0',Accept:'application/json',Prefer:'odata.maxpagesize=500'}});
  if(!r.ok) throw new Error('COMPASS '+r.status);
  return r.json();
}
async function dvAll(path){var out=[],url=DV_API+path;while(url){var d=await dvUrl(url);out=out.concat(d.value||[]);url=d['@odata.nextLink']||null;}return out;}
/* field eq id を 15 件ずつ or で */
async function dvIn(es,field,ids,select){
  var u=[];ids.forEach(function(x){if(x&&u.indexOf(x)<0)u.push(x);});
  var out=[];
  for(var i=0;i<u.length;i+=WK_CHUNK){
    var f=u.slice(i,i+WK_CHUNK).map(function(g){return field+' eq '+g;}).join(' or ');
    out=out.concat(await dvAll('/'+es+'?$filter='+encodeURIComponent(f)+'&$select='+select));
  }
  return out;
}

async function refreshWork(quiet){
  if(W.busy) return;
  W.busy=true;
  try{
    var m=await Promise.all([LEENAI.master.get('pol_staff'),LEENAI.master.get('doc_staff')]);
    W.pol=(m[0]||[]).map(function(r){return {pol:String(r.pol||'').trim().toUpperCase(),staff:r.staff||'',assist:r.assist||''};});
    W.doc=(m[1]||[]).map(function(r){return {iv_code:String(r.iv_code||'').trim(),importer:r.importer||'',staff:r.staff||''};});
    W.raw=await loadWorkRaw(new Date());
    W.rows=buildWork(W.raw,new Date(),W.pol,W.doc);W.loadedAt=new Date();W.err='';
  }catch(e){W.err=e.message;if(!quiet)LEENAI.toast('今日の作業を読み込めません: '+e.message,'danger');}

}

    render();
  }catch(e){
    $('mpPanel').innerHTML='<div class="mp-empty">読み込めません: '+esc(e.message)+'</div>';
  }finally{LEENAI.loading.hide();}
  if(S.timer) clearInterval(S.timer);
  S.timer=setInterval(function(){refresh(true);},REFRESH_MS);
  if(S.me&&$('mpWork')){
    refreshWork(true);   // 右側は左の読み込みを待たせない
    if(W.timer) clearInterval(W.timer);
    W.timer=setInterval(function(){refreshWork(true);},WORK_MS);
  }
}
function unmount(){
  if(S.timer){clearInterval(S.timer);S.timer=null;}
  if(W.timer){clearInterval(W.timer);W.timer=null;}
  if(ROOT){ROOT.removeEventListener('click',onClick);ROOT.removeEventListener('change',onChange);}
  document.removeEventListener('keydown',onKey);
}
return {mount:mount,unmount:unmount,refresh:refresh,_S:S,_W:W,_buildWork:buildWork,_workView:workView,_wkDates:wkDates,_renderWork:renderWork,_wkContractOwner:wkContractOwner};
})();
