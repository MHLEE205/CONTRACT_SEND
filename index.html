<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEENAI 契約書自動発行ツール v2.2</title>
<script src="images_b64.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
  --surface3: #2a2f46; --border: #2e3350;
  --text: #e2e8f0; --text2: #8892a4; --text3: #4a5568;
  --accent: #4f8ef7; --ok: #22c55e; --warn: #f59e0b;
  --danger: #ef4444; --info: #38bdf8; --radius: 10px;
}
[data-theme="light"] {
  --bg: #f4f6fb; --surface: #ffffff; --surface2: #f0f4ff;
  --surface3: #e8edf7; --border: #d1d5db;
  --text: #111827; --text2: #6b7280; --text3: #9ca3af;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Meiryo', 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 54px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-left { display: flex; align-items: center; gap: 10px; }
.logo { width: 30px; height: 30px; background: linear-gradient(135deg, var(--accent), #6ee7b7); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: #fff; }
.header-title { font-size: 14px; font-weight: 700; }
.header-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
.header-right { display: flex; gap: 8px; align-items: center; }
.conn-badge { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
.conn-badge.offline { background: var(--surface2); color: var(--text3); }
.conn-badge.connecting { background: rgba(245,158,11,0.15); color: var(--warn); }
.conn-badge.online { background: rgba(34,197,94,0.15); color: var(--ok); }
.user-chip { font-size: 11px; color: var(--accent); background: rgba(79,142,247,0.12); padding: 3px 10px; border-radius: 20px; font-weight: 600; display: none; }
.theme-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; color: var(--text2); font-size: 14px; display: flex; align-items: center; justify-content: center; }

.loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
.loading-overlay.show { display: flex; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--text2); }

.login-card { max-width: 480px; margin: 60px auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px; text-align: center; }
.login-icon { font-size: 40px; margin-bottom: 12px; }
.login-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; line-height: 1.7; }
.btn-primary { background: var(--accent); color: #fff; border: none; padding: 14px 32px; border-radius: var(--radius); font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

.tabs { background: var(--surface); border-bottom: 1px solid var(--border); display: none; padding: 0 24px; gap: 2px; }
.tab { padding: 12px 18px; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; background: none; border-left: none; border-right: none; border-top: none; font-family: inherit; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.main { max-width: 880px; margin: 0 auto; padding: 28px 20px; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.steps-bar { display: flex; align-items: center; margin-bottom: 28px; }
.step-node { display: flex; flex-direction: column; align-items: center; }
.step-circle { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text3); transition: all 0.3s; }
.step-circle.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px rgba(79,142,247,0.2); }
.step-circle.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.step-label-text { font-size: 10px; color: var(--text3); margin-top: 4px; white-space: nowrap; }
.step-line { flex: 1; height: 2px; background: var(--border); margin: 0 6px 14px; transition: background 0.3s; }
.step-line.done { background: var(--ok); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; animation: fadeUp 0.2s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.card-title { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 16px; letter-spacing: 0.5px; text-transform: uppercase; }

.input-lg { width: 100%; background: var(--surface2); border: 2px solid var(--border); border-radius: var(--radius); padding: 14px 18px; font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: 2px; transition: border 0.2s; font-family: 'Courier New', monospace; text-transform: uppercase; }
.input-lg:focus { outline: none; border-color: var(--accent); }
.input-lg::placeholder { font-size: 14px; letter-spacing: 0; font-weight: 400; font-family: 'Meiryo', sans-serif; color: var(--text3); }

.input-row { display: flex; gap: 10px; margin-top: 12px; }
.btn-query { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 12px 28px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: inherit; transition: all 0.2s; }
.btn-query:hover { opacity: 0.88; }
.btn-secondary { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 18px; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; font-family: inherit; transition: all 0.2s; }
.btn-secondary:hover { border-color: var(--text2); color: var(--text); }
.btn-back { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 20px; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; font-family: inherit; transition: all 0.2s; }
.btn-back:hover { border-color: var(--text2); }
.btn-send { flex: 1; background: var(--ok); border: none; border-radius: var(--radius); padding: 14px 24px; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer; font-family: inherit; transition: all 0.2s; }
.btn-send:hover { opacity: 0.88; }
.btn-send:disabled { opacity: 0.35; cursor: not-allowed; }

.info-box { background: rgba(79,142,247,0.08); border: 1px solid rgba(79,142,247,0.25); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--info); margin-bottom: 12px; }
.ok-box { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--ok); margin-bottom: 12px; }
.warn-box { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.25); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--warn); margin-bottom: 12px; }
.err-box { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--danger); margin-bottom: 12px; }

.master-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: var(--ok); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; }
.no-master-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: var(--warn); border-radius: 20px; padding: 4px 14px; font-size: 12px; font-weight: 600; cursor: pointer; background-color: transparent; font-family: inherit; }
.no-master-btn:hover { background: rgba(245,158,11,0.15); }

.chips-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; color: var(--text2); cursor: pointer; transition: all 0.2s; }
.chip:hover { border-color: var(--accent); color: var(--accent); }

.send-info-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.send-info-row { display: flex; gap: 10px; margin-bottom: 5px; font-size: 13px; }
.send-info-row:last-child { margin-bottom: 0; }
.send-info-label { color: var(--text2); font-weight: 700; min-width: 45px; }

.preview-outer { background: #e2e8f0; padding: 24px; display: flex; justify-content: center; }

/* ===== 계약서 CSS v2.2 (리나이 설계) ===== */
.contract-a4 {
  width: 700px;
  height: 1122px; /* A4 고정 — 절대 변경 금지 */
  overflow: hidden;
  background: #fff;
  font-family: 'Meiryo','MS PGothic','Hiragino Sans',sans-serif;
  font-size: 11px;
  line-height: 1.6;
  color: #1a1a1a;
  padding: 32px 40px 20px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15);
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}
.c-hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #e0f2fe; flex-shrink: 0; }
.c-hdr-logo { display: flex; align-items: center; gap: 10px; }
.c-hdr-logo-img { height: 36px; display: block; }
.c-hdr-info { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 6px; padding: 7px 14px; text-align: right; }
.c-hdr-info-row { font-size: 10px; color: #64748b; white-space: nowrap; line-height: 2; }
.c-hdr-info-row strong { color: #0f172a; font-size: 11px; margin-left: 8px; }
.c-hdr-info-row .contract-no { color: #0891b2; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; }
.c-title-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-shrink: 0; }
.c-title-bar-accent { width: 4px; height: 30px; background: #06b6d4; border-radius: 2px; flex-shrink: 0; }
.c-title-bar { background: #0f172a; flex: 1; padding: 9px 0; border-radius: 5px; text-align: center; color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 8px; }
.c-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; flex-shrink: 0; }
.c-party { border: 1px solid #e0f2fe; border-radius: 5px; overflow: hidden; }
.c-party-head { background: #f0f9ff; padding: 4px 10px; display: flex; align-items: center; gap: 6px; }
.c-party-badge { color: #fff; font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 3px; }
.c-party-badge.ko { background: #0891b2; }
.c-party-badge.otsu { background: #06b6d4; }
.c-party-role { font-size: 10px; color: #64748b; }
.c-party-body { padding: 7px 10px; }
.c-party-name { font-size: 12px; font-weight: 700; color: #0f172a; margin-bottom: 3px; }
.c-party-sub { font-size: 10px; color: #475569; line-height: 1.9; }
.c-intro { font-size: 11px; color: #475569; margin-bottom: 8px; flex-shrink: 0; }
.c-table { width: 100%; border-collapse: collapse; font-size: 11px; flex-shrink: 0; }
.c-table thead tr { border-top: 2px solid #0f172a; border-bottom: 1.5px solid #0891b2; background: #f8fafc; }
.c-table th { padding: 6px 5px; color: #0f172a; font-weight: 700; text-align: center; }
.c-table th.left { text-align: left; }
.c-table td { padding: 6px 5px; border-bottom: 1px solid #e0f2fe; vertical-align: middle; }
.c-table tbody tr:nth-child(even) { background: #f8fafc; }
.c-table .td-no { text-align: center; color: #94a3b8; font-size: 10px; width: 22px; }
.c-table .td-name { font-weight: 600; color: #0f172a; white-space: nowrap; }
.c-table .td-name-jp { color: #64748b; font-size: 10px; }
.c-table .td-qty { text-align: right; white-space: nowrap; }
.c-table .td-count { text-align: center; }
.c-table .td-price { text-align: right; }
.c-table .td-cond { text-align: center; white-space: nowrap; font-size: 10px; }
.c-table .td-amt { text-align: right; font-weight: 700; color: #0891b2; }
.c-totals-wrap { display: flex; justify-content: flex-end; margin-bottom: 10px; flex-shrink: 0; }
.c-totals { width: 230px; }
.c-total-row { display: flex; justify-content: space-between; padding: 4px 10px; border-bottom: 1px solid #e0f2fe; font-size: 11px; }
.c-total-row .lbl { color: #64748b; }
.c-total-row .val { font-weight: 600; }
.c-total-row .tax-val { color: #64748b; }
.c-total-grand { display: flex; justify-content: space-between; padding: 6px 10px; background: #0f172a; border-radius: 4px; margin-top: 2px; }
.c-total-grand .lbl { color: #22d3ee; font-size: 10px; font-weight: 700; }
.c-total-grand .val { color: #fff; font-weight: 700; font-size: 13px; }
.c-cond-wrap { display: grid; grid-template-columns: 3fr 2fr; border: 1px solid #e0f2fe; border-radius: 5px 5px 0 0; overflow: hidden; flex-shrink: 0; }
.c-cond-left { padding: 8px 12px; border-right: 1px solid #e0f2fe; background: #fafafa; font-size: 10px; }
.c-cond-grid { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; line-height: 2.1; }
.c-cond-key { color: #0891b2; font-weight: 700; white-space: nowrap; }
.c-cond-val { color: #374151; white-space: nowrap; }
.c-cond-right { padding: 8px 12px; background: #f0f9ff; font-size: 10px; line-height: 2.1; }
.c-cond-right-title { font-weight: 700; color: #0f172a; }
.c-cond-right-sub { color: #374151; padding-left: 8px; }
.c-cond-right-mail { color: #0891b2; padding-left: 8px; font-size: 9px; }
.c-remarks-wrap { border: 1px solid #e0f2fe; border-top: none; border-radius: 0 0 5px 5px; padding: 8px 12px; background: #fff; flex-shrink: 0; margin-bottom: 10px; }
.c-remarks-title { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.c-remarks-title-accent { width: 3px; height: 12px; background: #06b6d4; border-radius: 2px; }
.c-remarks-title-text { font-size: 10px; font-weight: 700; color: #0f172a; }
.c-remarks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; font-size: 10px; color: #374151; line-height: 2.1; }
.c-tokki-divider { border: none; border-top: 1px dashed #bae6fd; margin: 6px 0; }
.c-tokki-text { font-size: 10px; color: #0f172a; line-height: 1.8; min-height: 14px; white-space: pre-wrap; word-break: break-all; }
.c-signs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex-shrink: 0; margin-top: auto; }
.c-sign-box { border: 1px solid #e0f2fe; border-radius: 5px; padding: 10px 12px; background: #fafafa; }
.c-sign-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.c-sign-badge { color: #fff; font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 3px; }
.c-sign-badge.leenear { background: #06b6d4; }
.c-sign-badge.packer { background: #94a3b8; }
.c-sign-name { font-size: 11px; font-weight: 700; color: #0f172a; }
.c-sign-title { font-size: 10px; color: #475569; margin-bottom: 4px; }
.c-sign-img-wrap { position: relative; height: 72px; border-bottom: 1px solid #cbd5e1; }
.c-sign-img { position: absolute; bottom: 6px; left: 0; height: 58px; mix-blend-mode: multiply; opacity: 0.88; }
.c-stamp-img { position: absolute; bottom: 0; left: 48px; height: 70px; mix-blend-mode: multiply; opacity: 0.92; }
.recent-wrap { margin-top: 16px; }
.recent-filter-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.select-sm { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12px; color: var(--text); font-family: inherit; }
.input-sm { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12px; color: var(--text); font-family: inherit; flex: 1; }
.input-sm:focus, .select-sm:focus { outline: none; border-color: var(--accent); }
.recent-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.recent-table th { background: var(--surface2); color: var(--text2); font-weight: 700; padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); }
.recent-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text); }
.recent-table tbody tr { cursor: pointer; transition: background 0.15s; }
.recent-table tbody tr:hover { background: var(--surface2); }
.c-sign-title { font-size: 10px; color: #333; font-weight: 700; margin-bottom: 5px; }
.c-sign-stamp { text-align: right; font-size: 10px; color: #bbb; margin-top: 14px; }
.c-footer { font-size: 9px; color: #aaa; text-align: right; margin-top: 8px; }

.nav-row { display: flex; gap: 10px; margin-top: 20px; }

.complete-wrap { text-align: center; padding: 40px 16px; }
.complete-icon { font-size: 60px; margin-bottom: 16px; }
.complete-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: var(--ok); }
.complete-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; }
.complete-info { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: left; margin-bottom: 24px; }
.ci-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.ci-row:last-child { border-bottom: none; }
.ci-label { color: var(--text2); }

.section-title { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 14px; }
.history-list { display: flex; flex-direction: column; gap: 10px; }
.history-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.history-no { font-size: 14px; font-weight: 700; color: var(--accent); }
.history-meta { font-size: 12px; color: var(--text2); margin-top: 3px; }
.status-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
.status-sent { background: rgba(34,197,94,0.15); color: var(--ok); }
.status-failed { background: rgba(239,68,68,0.15); color: var(--danger); }

.powered { text-align: center; font-size: 11px; color: var(--text3); margin-top: 40px; padding: 20px; }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">処理中...</div>
</div>

<script>
// ===== 이미지 base64 helper =====
function b64ToUint8(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

// ═══════════════════════════════════════
// 定数
// ═══════════════════════════════════════
const CLIENT_ID    = 'f071a165-5e9b-44bf-b6a1-baba654524db';
const TENANT_ID    = 'a56988ff-c2b8-4df8-9727-889ad4205198';
const DV_URL       = 'https://orgde512c6f.crm7.dynamics.com';
const DV_API       = `${DV_URL}/api/data/v9.2`;
const REDIRECT_URI = location.origin + location.pathname;
const DV_SCOPE     = `${DV_URL}/user_impersonation openid profile`;
const GRAPH_SCOPE  = 'https://graph.microsoft.com/Mail.Send openid profile';
const DB_NAME      = 'leenai_contract_send_v1';
const DB_STORE     = 'send_history';

// ═══════════════════════════════════════
// 状態
// ═══════════════════════════════════════
const S = {
  dvToken: '', dvExpiry: 0,
  graphToken: '', graphExpiry: 0,
  userEmail: '', userName: '',
  contractMaster: [], masterFileName: '',
  step: 0,
  contractNo: '',
  contractData: null,
  lastSent: null,
  recentContracts: [],
  packerMap: {},
};

// ═══════════════════════════════════════
// IndexedDB
// ═══════════════════════════════════════
let db = null;
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(DB_STORE)) {
        d.createObjectStore(DB_STORE, { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = e => rej(e.target.error);
  });
}
function dbAdd(record) {
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    const req = tx.objectStore(DB_STORE).add(record);
    req.onsuccess = () => res(req.result);
    req.onerror = e => rej(e.target.error);
  });
}
function dbGetAll() {
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).getAll();
    req.onsuccess = () => res([...req.result].reverse());
    req.onerror = e => rej(e.target.error);
  });
}

// ═══════════════════════════════════════
// PKCE OAuth
// ═══════════════════════════════════════
function b64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function sha256(str) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
}
function randomStr(len) {
  const a = new Uint8Array(len || 64);
  crypto.getRandomValues(a);
  return b64url(a).slice(0, len || 64);
}

function saveDvSession() {
  sessionStorage.setItem('dv_token',  S.dvToken);
  sessionStorage.setItem('dv_expiry', S.dvExpiry);
  sessionStorage.setItem('dv_user',   S.userName);
  sessionStorage.setItem('dv_email',  S.userEmail);
  if (S.contractMaster.length) {
    sessionStorage.setItem('dv_master',      JSON.stringify(S.contractMaster));
    sessionStorage.setItem('dv_master_name', S.masterFileName);
  }
}
async function restoreDvSession() {
  const t = sessionStorage.getItem('dv_token');
  const master = sessionStorage.getItem('dv_master');
  if (master) {
    try { S.contractMaster = JSON.parse(master); } catch(e) {}
    S.masterFileName = sessionStorage.getItem('dv_master_name') || '';
    sessionStorage.removeItem('dv_master');
    sessionStorage.removeItem('dv_master_name');
  }
  if (!t) return;
  S.dvToken   = t;
  S.dvExpiry  = Number(sessionStorage.getItem('dv_expiry') || 0);
  S.userName  = sessionStorage.getItem('dv_user')  || '';
  S.userEmail = sessionStorage.getItem('dv_email') || '';
  sessionStorage.removeItem('dv_token');
  sessionStorage.removeItem('dv_expiry');
  sessionStorage.removeItem('dv_user');
  sessionStorage.removeItem('dv_email');
  if (S.dvToken && Date.now() < S.dvExpiry) {
    setConn('online', '● Dataverse接続');
    const uc = document.getElementById('userChip');
    if (uc && S.userName) { uc.textContent = S.userName; uc.style.display = 'inline-block'; }
  }
}

async function startLogin(scope) {
  setConn('connecting', '● 接続中...');
  const useScope = scope || DV_SCOPE;
  const verifier = randomStr(64);
  const challenge = b64url(await sha256(verifier));
  const state = 'cs_' + randomStr(16);
  sessionStorage.setItem('pkce_verifier', verifier);
  sessionStorage.setItem('pkce_state', state);
  sessionStorage.setItem('pkce_scope_type', scope === GRAPH_SCOPE ? 'graph' : 'dv');
  const p = {
    client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI,
    scope: useScope, state, code_challenge: challenge, code_challenge_method: 'S256',
  };
  // Graph ログイン時: login_hint でアカウント選択画面をスキップ
  if (scope === GRAPH_SCOPE && S.userEmail) p.login_hint = S.userEmail;
  else p.prompt = 'select_account';
  location.href = `https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/authorize?${new URLSearchParams(p)}`;
}

async function handleCallback() {
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if (!code) return false;
  history.replaceState({}, '', location.pathname);

  const verifier = sessionStorage.getItem('pkce_verifier');
  const scopeType = sessionStorage.getItem('pkce_scope_type') || 'dv';
  const useScope = scopeType === 'graph' ? GRAPH_SCOPE : DV_SCOPE;
  sessionStorage.removeItem('pkce_verifier');
  sessionStorage.removeItem('pkce_state');
  sessionStorage.removeItem('pkce_scope_type');

  showLoading('認証処理中...');
  try {
    const res = await fetch(`https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: CLIENT_ID, grant_type: 'authorization_code',
        code, redirect_uri: REDIRECT_URI, code_verifier: verifier, scope: useScope
      })
    });
    const data = await res.json();
    if (!data.access_token) throw new Error(data.error_description || 'トークン取得失敗');

    if (scopeType === 'graph') {
      S.graphToken = data.access_token;
      S.graphExpiry = Date.now() + (data.expires_in - 60) * 1000;
      // DV セッションを sessionStorage から復元
      await restoreDvSession();
      const pending = sessionStorage.getItem('pending_contract');
      const pendingNo = sessionStorage.getItem('pending_contract_no');
      sessionStorage.removeItem('pending_contract');
      sessionStorage.removeItem('pending_contract_no');
      hideLoading();
      await initMainUI();
      if (pending) {
        S.contractData = JSON.parse(pending);
        S.contractNo = pendingNo || '';
        setStep(1);
      } else {
        setStep(0);
      }
    } else {
      S.dvToken = data.access_token;
      S.dvExpiry = Date.now() + (data.expires_in - 60) * 1000;
      try {
        const me = await fetch('https://graph.microsoft.com/v1.0/me', {
          headers: { Authorization: `Bearer ${S.dvToken}` }
        }).then(r => r.json());
        S.userName = me.displayName || '';
        S.userEmail = me.mail || me.userPrincipalName || '';
        const uc = document.getElementById('userChip');
        uc.textContent = S.userName;
        uc.style.display = 'inline-block';
      } catch(e) {}
      setConn('online', '● Dataverse接続');
      hideLoading();
      await initMainUI();
      setStep(0);
    }
  } catch(e) {
    hideLoading();
    setConn('offline', '● オフライン');
    alert('認証エラー: ' + e.message);
  }
  return true;
}

async function dvGet(path) {
  if (Date.now() > S.dvExpiry) throw new Error('セッション切れです。再ログインしてください。');
  const res = await fetch(`${DV_API}/${path}`, {
    headers: {
      'Authorization': `Bearer ${S.dvToken}`,
      'OData-MaxVersion': '4.0', 'OData-Version': '4.0',
      'Accept': 'application/json',
      'Prefer': 'odata.include-annotations="OData.Community.Display.V1.FormattedValue"'
    }
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(`DV API ${res.status}: ${e?.error?.message || res.statusText}`);
  }
  return res.json();
}

// ═══════════════════════════════════════
// UI ヘルパー
// ═══════════════════════════════════════
function setConn(cls, text) {
  const b = document.getElementById('connBadge');
  b.className = 'conn-badge ' + cls;
  b.textContent = text;
}
function showLoading(text) {
  document.getElementById('loadingText').textContent = text || '処理中...';
  document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('show');
}
function toggleTheme() {
  const h = document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}
function showTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
  if (id === 'history') renderHistory();
}
function showMsg(cls, msg, containerId, prepend) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = msg;
  if (prepend) el.prepend(div); else el.appendChild(div);
  setTimeout(() => div.remove(), 5000);
}

async function initMainUI() {
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('tabsBar').style.display = 'flex';
  document.getElementById('tab-hassin').classList.add('active');
  await openDB();
  loadRecentContracts();
}

async function loadRecentContracts() {
  if (!S.dvToken || Date.now() > S.dvExpiry) return;
  try {
    const pkRes = await dvGet('cr49f_packers?$select=cr49f_packerid,cr49f_packer_name&$top=200');
    (pkRes.value || []).forEach(p => { S.packerMap[p.cr49f_packerid] = p.cr49f_packer_name || ''; });
    const rcRes = await dvGet(
      'cr49f_purchase_contracts?$top=30&$orderby=cr49f_contract_date desc' +
      '&$select=cr49f_purchase_contractid,cr49f_purchase_contract_no,cr49f_contract_date,_cr49f_packer_id_value'
    );
    S.recentContracts = rcRes.value || [];
    const el = document.getElementById('recentWrap');
    if (el) renderRecentTable();
  } catch(e) {}
}

function renderRecentTable() {
  const el = document.getElementById('recentWrap');
  if (!el) return;
  const packerFilter = document.getElementById('packerFilter') ? document.getElementById('packerFilter').value : '';
  const keyword = (document.getElementById('recentSearch') ? document.getElementById('recentSearch').value : '').toLowerCase();
  const packers = [...new Set(S.recentContracts.map(c => c._cr49f_packer_id_value).filter(Boolean))];
  const filtered = S.recentContracts.filter(c => {
    const pm = !packerFilter || c._cr49f_packer_id_value === packerFilter;
    const pn = S.packerMap[c._cr49f_packer_id_value] || '';
    const km = !keyword || (c.cr49f_purchase_contract_no || '').toLowerCase().includes(keyword) || pn.toLowerCase().includes(keyword);
    return pm && km;
  });
  const opts = packers.map(id => '<option value="' + id + '">' + (S.packerMap[id] || id) + '</option>').join('');
  let rows = '';
  filtered.slice(0, 20).forEach(c => {
    const no = c.cr49f_purchase_contract_no || '';
    const pn = S.packerMap[c._cr49f_packer_id_value] || '—';
    const dt = (c.cr49f_contract_date || '').split('T')[0] || '—';
    rows += '<tr onclick="S.contractNo=\'' + no + '\';document.getElementById(\'cnInput\').value=\'' + no + '\';"><td>' + no + '</td><td>' + pn + '</td><td>' + dt + '</td></tr>';
  });
  el.innerHTML =
    '<div style="font-size:11px;color:var(--text3);font-weight:700;margin-bottom:6px;">最近の契約 (直近30件)</div>' +
    '<div class="recent-filter-row">' +
      '<select class="select-sm" id="packerFilter" onchange="renderRecentTable()">' +
        '<option value="">Packer: 全て</option>' + opts +
      '</select>' +
      '<input class="input-sm" id="recentSearch" placeholder="契約番号 / Packer 検索..." oninput="renderRecentTable()" value="' + keyword + '">' +
    '</div>' +
    (filtered.length === 0
      ? '<div style="font-size:12px;color:var(--text3);padding:10px 0;">該当なし</div>'
      : '<table class="recent-table"><thead><tr><th>契約番号</th><th>Packer</th><th>契約日</th></tr></thead><tbody>' + rows + '</tbody></table>');
}

// ═══════════════════════════════════════
// STEP BAR
// ═══════════════════════════════════════
function renderStepsBar() {
  const labels = ['① 契約番号', '② 内容確認', '③ 発送完了'];
  let html = '';
  labels.forEach((label, i) => {
    if (i > 0) html += `<div class="step-line ${i <= S.step ? 'done' : ''}"></div>`;
    const cls = i < S.step ? 'done' : i === S.step ? 'active' : '';
    html += `<div class="step-node">
      <div class="step-circle ${cls}">${i < S.step ? '✓' : i + 1}</div>
      <div class="step-label-text">${label}</div>
    </div>`;
  });
  document.getElementById('stepsBar').innerHTML = html;
}

function setStep(n) {
  S.step = n;
  renderStepsBar();
  const renders = [renderStep0, renderStep1, renderStep2];
  document.getElementById('stepContent').innerHTML = renders[n]();
  if (n === 0) {
    if (S.recentContracts.length > 0) renderRecentTable();
    else setTimeout(() => { if (S.recentContracts.length > 0) renderRecentTable(); }, 1500);
  }
}

// ═══════════════════════════════════════
// STEP 0: 契約番号入力
// ═══════════════════════════════════════
function renderStep0() {
  const masterEl = S.masterFileName
    ? `<span class="master-chip">📋 ${S.masterFileName}</span>`
    : `<button class="no-master-btn" onclick="loadMasterFile()">⚠️ CONTRACT_MASTER.xlsx 未選択 — クリックして選択</button>`;

  return `<div class="card">  
    <div class="card-title">STEP 1 — 契約番号を入力</div>
    <input class="input-lg" id="cnInput" placeholder="例: LR-2604KN4"
      value="${S.contractNo}"
      oninput="S.contractNo=this.value.toUpperCase();this.value=S.contractNo;"
      onkeydown="if(event.key==='Enter')queryContract()">
    <div class="input-row">
      <button class="btn-query" onclick="queryContract()">🔍 照会</button>
    </div>
    <div style="margin-top:16px;">
      <div style="font-size:11px;color:var(--text3);margin-bottom:7px;">収信先マスター (CONTRACT_MASTER.xlsx)</div>
      ${masterEl}
      ${!S.masterFileName ? `<div style="margin-top:6px;font-size:11px;color:var(--text3);">未選択の場合、発送先メールアドレスが取得できません</div>` : ''}
    </div>
    <div id="recentWrap" class="recent-wrap"></div>
    <div id="step0err" style="margin-top:12px;"></div>
  </div>`;
}

function loadMasterFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const ws = wb.Sheets['Packers'] || wb.Sheets[wb.SheetNames[0]];
      S.contractMaster = XLSX.utils.sheet_to_json(ws);
      S.masterFileName = file.name;
      setStep(0);
    } catch(err) {
      alert('ファイル読み込みエラー: ' + err.message);
    }
  };
  input.click();
}

async function queryContract() {
  const no = S.contractNo.trim();
  if (!no) { alert('契約番号を入力してください。'); return; }
  if (!S.dvToken || Date.now() > S.dvExpiry) { alert('Dataverseセッション切れです。再ログインしてください。'); return; }

  const errEl = document.getElementById('step0err');
  if (errEl) errEl.innerHTML = '';

  showLoading('COMPASS照会中...');
  try {
    // 1. 契約ヘッダー
    const hdrRes = await dvGet(
      `cr49f_purchase_contracts?$filter=cr49f_purchase_contract_no eq '${no}'&$top=1` +
      `&$select=cr49f_purchase_contractid,cr49f_purchase_contract_no,` +
      `cr49f_contract_date,cr49f_latest_vanning,cr49f_payment_term,` +
      `cr49f_exchange_rate,_cr49f_packer_id_value`
    );
    if (!hdrRes.value?.length) throw new Error(`「${no}」がCOMPASSに見つかりません`);
    const h = hdrRes.value[0];
    const contractId = h.cr49f_purchase_contractid;
    const packerGuid = h['_cr49f_packer_id_value'];
    if (!packerGuid) throw new Error('Packer情報が取得できません');

    // 2. 明細
    const detRes = await dvGet(
      `cr49f_purchase_details?$filter=_cr49f_purchase_contract_id_value eq ${contractId}` +
      `&$expand=cr49f_item_id($select=cr49f_item,crcf9_item_japan)` +
      `&$select=cr49f_count,cr49f_incoterms,cr49f_loading_port,cr49f_price,cr49f_quantity,cr49f_remark`
    );

    // 3. Packer
    const pkRes = await dvGet(
      `cr49f_packers(${packerGuid})` +
      `?$select=cr49f_packer_name,cr49f_packer_address,cr49f_packer_person,` +
      `cr49f_packer_tel,cr49f_parker_fax,cr49f_packer,cr49f_packer_code`
    );

    // 4. メールアドレス (MASTER) — 正式コード (cr49f_packer) で検索
    const packerCode = pkRes.cr49f_packer || '';
    const packerFullName = pkRes.cr49f_packer_name || '';
    let toAddr = '', ccAddrs = [];
    if (S.contractMaster.length) {
      const row = S.contractMaster.find(
        r => (r['正式コード'] || '').trim() === (packerCode || '').trim()
      );
      if (row) {
        toAddr = row['MAIL1(宛先)'] || '';
        ccAddrs = ['MAIL2(宛先)','MAIL3(CC)','MAIL4(CC)','MAIL5(CC)',
                   'MAIL6(CC)','MAIL7(CC)','MAIL8(rcp@)']
          .map(k => row[k]).filter(Boolean);
      }
    }
    if (!ccAddrs.includes('rcp@leenearcorp.com')) {
      ccAddrs.push('rcp@leenearcorp.com');
    }

    const details = (detRes.value || []).map(d => {
      const qty = (d.cr49f_quantity || 0) * 1000;
      return {
        itemCode: d.cr49f_item_id?.cr49f_item || '',
        itemName: d.cr49f_item_id?.crcf9_item_japan || '',
        qty,
        count: d.cr49f_count || 0,
        price: d.cr49f_price || 0,
        pol: d.cr49f_loading_port || '',
        incoterms: d.cr49f_incoterms || '',
        remark: d.cr49f_remark || '',
        amount: Math.floor(qty * (d.cr49f_price || 0)),
      };
    });

    S.contractData = { header: h, details, packer: pkRes, toAddr, ccAddrs };

    const recent = JSON.parse(sessionStorage.getItem('recent_cn') || '[]');
    if (!recent.includes(no)) { recent.unshift(no); if (recent.length > 5) recent.pop(); }
    sessionStorage.setItem('recent_cn', JSON.stringify(recent));

    hideLoading();
    setStep(1);
  } catch(e) {
    hideLoading();
    const errEl = document.getElementById('step0err');
    if (errEl) errEl.innerHTML = `<div class="err-box">❌ ${e.message}</div>`;
  }
}

// ═══════════════════════════════════════
// STEP 1: プレビュー
// ═══════════════════════════════════════
function renderStep1() {
  const { header: h, details, packer: pk, toAddr, ccAddrs } = S.contractData;
  const contractNo = h.cr49f_purchase_contract_no || '';
  const packerCode = pk.cr49f_packer_code || pk.cr49f_packer || '';
  const pdfName = `${contractNo}_${pk.cr49f_packer_name || packerCode}_購買契約書.pdf`;

  const noMailWarn = !toAddr
    ? `<div class="warn-box">⚠️ CONTRACT_MASTER.xlsx に「${pk.cr49f_packer_name || packerCode}」の発送先が見つかりません。発送ボタンは無効です。</div>`
    : '';

  return `
    <div class="ok-box">✅ COMPASS照会完了 — ${contractNo}</div>
    ${noMailWarn}
    <div class="send-info-card">
      <div class="send-info-row"><span class="send-info-label">To:</span><span>${toAddr || '(未設定)'}</span></div>
      <div class="send-info-row"><span class="send-info-label">CC:</span><span>${ccAddrs.join(', ') || '—'}</span></div>
      <div class="send-info-row"><span class="send-info-label">PDF:</span><span>${pdfName}</span></div>
    </div>
    <div class="nav-row" style="margin-bottom:14px;">
      <button class="btn-back" onclick="setStep(0)">← 戻る</button>
      <button class="btn-send" onclick="doSend()" ${!toAddr ? 'disabled title="収信先未設定"' : ''}>
        📝 Outlookに下書き保存
      </button>
    </div>
    <div class="card" style="margin-top:12px;">
      <div class="card-title" style="font-size:13px;margin-bottom:8px;">

function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}

function fmtNum(n) {
  return Number(n || 0).toLocaleString('ja-JP');
}

function buildContractDoc(S, details, packer) {
  const {
    Document, Paragraph, TextRun, Table, TableRow, TableCell,
    ImageRun, AlignmentType, BorderStyle, WidthType, ShadingType, VerticalAlign
  } = window.docx;

  const BLACK='1A1A1A', DGRAY='4A4A4A', MGRAY='888888';
  const LGRAY='F5F5F5', XLGRAY='EBEBEB', BORDER='D1D5DB', WHITE='FFFFFF';
  const PAGE_W=11906, PAGE_H=16838, MARGIN_DXA=680;
  const CW = PAGE_W - MARGIN_DXA * 2;

  const bd  = (c,s) => ({style:BorderStyle.SINGLE,size:s||4,color:c||BORDER});
  const nob = ()    => ({style:BorderStyle.NONE,size:0,color:WHITE});
  const NOB = {top:nob(),bottom:nob(),left:nob(),right:nob(),insideH:nob(),insideV:nob()};

  const tx = (t,o={}) => new TextRun({text:t,font:'Meiryo',size:o.size||16,
    bold:o.bold||false,color:o.color||BLACK,...o});
  const pr = (ch,o={}) => new Paragraph({children:ch,
    spacing:{before:0,after:0,...(o.spacing||{})},...o});
  const ep = (h) => pr([tx('',{size:h||2})]);
  const mkC = (ch,w,o={}) => new TableCell({
    children:ch,
    width:w?{size:w,type:WidthType.DXA}:undefined,
    shading:o.bg?{fill:o.bg,type:ShadingType.CLEAR}:undefined,
    borders:o.borders||NOB,
    verticalAlign:o.va||VerticalAlign.CENTER,
    margins:{top:o.mt||80,bottom:o.mb||80,left:o.ml||120,right:o.mr||120},
    columnSpan:o.span||1,
  });
  const tbl = (cw,rows,borders) => new Table({
    width:{size:CW,type:WidthType.DXA},columnWidths:cw,rows,borders:borders||NOB,
  });

  const contractDate = S.contract?.cr49f_contract_date
    ? S.contract.cr49f_contract_date.split('T')[0].replace(/-/g,'/'):'';
  const contractNo = S.contract?.cr49f_purchase_contract_no||'';
  const deadline   = S.contract?.cr49f_latest_vanning
    ? S.contract.cr49f_latest_vanning.split('T')[0].replace(/-/g,'/'):'';
  const payment    = S.contract?.cr49f_payment_term||'';
  const packerName = packer?.cr49f_packer_name||'';
  const packerAddr = packer?.cr49f_packer_address||'';
  const packerTel  = packer?.cr49f_packer_tel||'';
  const packerFax  = packer?.cr49f_parker_fax||''; // ⚠️ parker 타이포 유지

  const logoData  = b64ToUint8(LOGO_B64);
  const signData  = b64ToUint8(SIGN_B64);
  const stampData = b64ToUint8(STAMP_B64);

  const children = [];

  // 1. 헤더
  const hLogoW=Math.round(CW*0.5), hDateW=CW-hLogoW;
  children.push(tbl([hLogoW,hDateW],[new TableRow({children:[
    mkC([pr([new ImageRun({data:logoData,transformation:{width:210,height:55},type:'png'})],
      {spacing:{before:0,after:40}})],hLogoW),
    mkC([
      pr([tx('日　　付：',{size:15,color:MGRAY}),tx(contractDate,{size:15,bold:true})],
        {alignment:AlignmentType.RIGHT,spacing:{before:0,after:40}}),
      pr([tx('契約番号：',{size:15,color:MGRAY}),tx(contractNo,{size:15,bold:true})],
        {alignment:AlignmentType.RIGHT,spacing:{before:0,after:60}}),
    ],hDateW),
  ]})],{...NOB,bottom:bd(BORDER,6)}));

  // 2. 타이틀
  children.push(pr([tx('売　買　契　約　書',{size:32,bold:true,color:WHITE})],{
    alignment:AlignmentType.CENTER,spacing:{before:80,after:80},
    shading:{fill:BLACK,type:ShadingType.CLEAR},
  }));

  // 3. 甲乙
  const pW=Math.round((CW-160)/2);
  const party=(badge,role,name,lines,bg)=>mkC([
    pr([tx(`${badge}（${role}）`,{size:14,bold:true,color:WHITE})],
      {spacing:{before:40,after:40},shading:{fill:bg,type:ShadingType.CLEAR}}),
    pr([tx(name,{size:19,bold:true})],{spacing:{before:40,after:25}}),
    ...lines.map(l=>pr([tx(l,{size:13,color:DGRAY})],{spacing:{before:0,after:18}})),
    ep(4),
  ],pW,{bg:LGRAY,va:VerticalAlign.TOP,
    borders:{top:bd(bg,10),bottom:bd(BORDER,4),left:bd(BORDER,4),right:bd(BORDER,4)}});

  children.push(tbl([pW,160,pW],[new TableRow({children:[
    party('甲','売主',packerName,
      [packerAddr,`TEL: ${packerTel}　FAX: ${packerFax}`].filter(Boolean),BLACK),
    mkC([ep()],160),
    party('乙','買主','株式会社リニア',
      ['〒101-0064 東京都千代田区神田猿楽町2-8-11',
       'VORT水道橋Ⅲ 5階　TEL: 03-3528-9850　FAX: 03-3528-9851'],DGRAY),
  ]})],NOB));
  children.push(pr([tx('甲乙は次の通り売買契約を締結する。',{size:15,color:MGRAY})],
    {spacing:{before:80,after:60}}));

  // 4. 품목표
  const cNo=400,cNm=3000,cQty=1900,cCnt=900,cPrc=950,cCnd=1700;
  const cAmt=CW-cNo-cNm-cQty-cCnt-cPrc-cCnd;
  const rowBd={top:nob(),bottom:bd(BORDER,2),left:nob(),right:nob()};
  const hdrBd={top:bd(BLACK,10),bottom:bd(DGRAY,6),left:nob(),right:nob()};

  const hC=(t,w,a)=>new TableCell({
    children:[pr([tx(t,{size:15,bold:true,color:BLACK})],{alignment:a||AlignmentType.CENTER})],
    width:{size:w,type:WidthType.DXA},shading:{fill:LGRAY,type:ShadingType.CLEAR},
    borders:hdrBd,margins:{top:80,bottom:80,left:100,right:100},
  });
  const dC=(t,w,a,bg,c)=>new TableCell({
    children:[pr([tx(t,{size:15,color:c||BLACK})],{alignment:a||AlignmentType.LEFT})],
    width:{size:w,type:WidthType.DXA},shading:{fill:bg||WHITE,type:ShadingType.CLEAR},
    borders:rowBd,margins:{top:70,bottom:70,left:100,right:100},
  });

  const itemRows = details.slice(0,6).map((d,i)=>{
    const qty=d.qty||0;
    const price=d.price||0;
    const amt=d.amount||0;
    const bg=i%2?XLGRAY:WHITE;
    return new TableRow({children:[
      dC(String(i+1),cNo,AlignmentType.CENTER,bg,MGRAY),
      dC(`${d.itemCode||''} / ${d.itemName||''}`,cNm,AlignmentType.LEFT,bg),
      dC(`${qty.toLocaleString()} KG`,cQty,AlignmentType.RIGHT,bg),
      dC(`${d.count||0}本`,cCnt,AlignmentType.CENTER,bg),
      dC(`¥${price}`,cPrc,AlignmentType.RIGHT,bg),
      dC(`${d.pol||''} ${d.incoterms||'港'}渡し`,cCnd,AlignmentType.CENTER,bg),
      dC(`¥${amt.toLocaleString()}`,cAmt,AlignmentType.RIGHT,bg,DGRAY),
    ]});
  });

  children.push(tbl([cNo,cNm,cQty,cCnt,cPrc,cCnd,cAmt],[
    new TableRow({children:[
      hC('No',cNo),hC('品名',cNm,AlignmentType.LEFT),
      hC('数量(KG)',cQty),hC('本数',cCnt),
      hC('単価',cPrc),hC('条件',cCnd),hC('金額(JPY)',cAmt),
    ]}),
    ...itemRows,
  ],NOB));

  // 5. 합계
  const subtotal=details.reduce((s,d)=>s+(d.amount||0),0);
  const tax=Math.floor(subtotal*0.1);
  const total=subtotal+tax;
  const totW=Math.round(CW*0.28),tLW=Math.round(totW*0.55),tRW=totW-tLW;
  const tRow=(lbl,val,bold,dark)=>new TableRow({children:[
    new TableCell({children:[pr([tx(lbl,{size:14,color:dark?WHITE:MGRAY,bold})])],
      width:{size:tLW,type:WidthType.DXA},shading:{fill:dark?BLACK:'FAFAFA',type:ShadingType.CLEAR},
      borders:{top:nob(),bottom:bd(BORDER,2),left:nob(),right:nob()},margins:{top:60,bottom:60,left:100,right:100}}),
    new TableCell({children:[pr([tx(val,{size:dark?16:14,color:dark?WHITE:BLACK,bold})],
      {alignment:AlignmentType.RIGHT})],
      width:{size:tRW,type:WidthType.DXA},shading:{fill:dark?BLACK:'FAFAFA',type:ShadingType.CLEAR},
      borders:{top:nob(),bottom:bd(BORDER,2),left:nob(),right:nob()},margins:{top:60,bottom:60,left:100,right:100}}),
  ]});
  children.push(tbl([CW-totW,totW],[new TableRow({children:[
    mkC([ep()],CW-totW),
    mkC([new Table({width:{size:totW,type:WidthType.DXA},columnWidths:[tLW,tRW],borders:NOB,rows:[
      tRow('税抜き',`¥${subtotal.toLocaleString()}`,false,false),
      tRow('消費税(10%)',`¥${tax.toLocaleString()}`,false,false),
      tRow('税込み',`¥${total.toLocaleString()}`,true,true),
    ]})],totW),
  ]})],NOB));

  // 6. 条件
  const cLW=Math.round(CW*0.62),cRW=CW-cLW;
  const cLine=(k,v)=>pr([tx(k,{size:14,bold:true}),tx(v,{size:14,color:DGRAY})],{spacing:{before:0,after:28}});
  children.push(tbl([cLW,cRW],[new TableRow({children:[
    mkC([ep(4),
      cLine('納入条件：','湿度12%以下、禁忌品の紙５%以下、禁忌品の紙以外は１%以下'),
      cLine('梱　　包：','輸出用ベール(BALES)'),
      cLine('出荷期限：',deadline),
      cLine('支払条件：',payment),
      cLine('向け先　：','インドネシア、韓国、ベトナム、マレーシア、タイ向け'),
      ep(4)],cLW,{bg:'FAFAFA',va:VerticalAlign.TOP}),
    mkC([ep(4),
      pr([tx('＊ 韓国向けの場合',{size:14,bold:true})],{spacing:{before:0,after:18}}),
      pr([tx('　放射能写真対応お願いします。',{size:14,color:DGRAY})],{spacing:{before:0,after:28}}),
      pr([tx('＊ 写真お送り先',{size:14,bold:true})],{spacing:{before:0,after:18}}),
      pr([tx('　photo_rcp@leenearcorp.com',{size:13,color:DGRAY})],{spacing:{before:0,after:0}}),
      ep(4)],cRW,{bg:'F9F9F9',va:VerticalAlign.TOP}),
  ]})],{...NOB,top:bd(BORDER,6),bottom:bd(BORDER,4),left:bd(BORDER,4),right:bd(BORDER,4),insideV:bd(BORDER,4)}));

  // 7. 備考 (왼쪽: 1-6 세로, 오른쪽: 特記事項)
  const bikoLW=Math.round(CW*0.58), bikoRW=CW-bikoLW;
  const bikoItems=[
    '１．分納可能',
    '２．契約量の±10％は変動可能',
    '３．インドネシア向けは全量コテクナ検査が必要',
    '４．コンテナ平均重量：全品種 25,000kgまで',
    '５．当社は反社会的勢力と一切関わりがない',
    '６．各向け地別、必要書類は異なります',
  ];
  children.push(tbl([bikoLW,bikoRW],[
    new TableRow({children:[
      mkC([
        pr([tx('＜備考＞',{size:14,bold:true})],{spacing:{before:50,after:20}}),
        ...bikoItems.map(item=>pr([tx(item,{size:13,color:DGRAY})],{spacing:{before:0,after:12}})),
        ep(4),
      ],bikoLW,{borders:NOB,va:VerticalAlign.TOP}),
      mkC([
        pr([tx('＜特記事項＞',{size:14,bold:true})],{spacing:{before:50,after:20}}),
        pr([tx(S.tokki||'',{size:13,color:DGRAY})],{spacing:{before:0,after:10}}),
        ep(4),
      ],bikoRW,{borders:{top:nob(),bottom:nob(),left:bd(BORDER,4),right:nob()},va:VerticalAlign.TOP}),
    ]}),
  ],{...NOB,bottom:bd(BORDER,4),left:bd(BORDER,4),right:bd(BORDER,4)}));

  // 8. 서명란
  const sW=Math.round((CW-160)/2);
  const signBlock=(badge,role,name,hasSign)=>mkC([
    pr([tx(`${badge}（${role}）`,{size:14,bold:true,color:WHITE})],{
      spacing:{before:40,after:40},
      shading:{fill:badge==='甲'?BLACK:DGRAY,type:ShadingType.CLEAR}
    }),
    pr([tx(name,{size:16,bold:true})],{spacing:{before:40,after:16}}),
    ...(hasSign?[
      pr([tx('代表取締役　李明鎬',{size:14,color:DGRAY})],{spacing:{before:0,after:20}}),
      pr([
        new ImageRun({data:signData,transformation:{width:130,height:70},type:'png'}),
        new ImageRun({data:stampData,transformation:{width:68,height:68},type:'png'}),
      ],{alignment:AlignmentType.LEFT,spacing:{before:0,after:10}}),
    ]:[ep(80)]),
    ep(4),
  ],sW,{borders:NOB,va:VerticalAlign.TOP});

  children.push(tbl([sW,160,sW],[new TableRow({children:[
    signBlock('甲','売主',packerName,false),
    mkC([ep()],160),
    signBlock('乙','買主','株式会社リニア',true),
  ]})],NOB));

  // 9. 푸터
  children.push(pr([tx('✦ Powered by LEENAI Automation System',{size:12,color:'BBBBBB'})],{
    alignment:AlignmentType.RIGHT,
    border:{top:{style:BorderStyle.SINGLE,size:2,color:'EEEEEE'}},
    spacing:{before:60,after:0}
  }));

  return new window.docx.Document({
    sections:[{
      properties:{page:{
        size:{width:PAGE_W,height:PAGE_H},
        margin:{top:MARGIN_DXA,right:MARGIN_DXA,bottom:MARGIN_DXA,left:MARGIN_DXA}
      }},
      children
    }]
  });
}

async function generatePdfViaOneDrive(S, details, packer) {
  showLoading('Word文書を生成中...');
  const doc = buildContractDoc(S, details, packer);
  const blob = await window.docx.Packer.toBlob(doc);
  const arrayBuffer = await blob.arrayBuffer();

  const filename = `leenai_tmp_${Date.now()}.docx`;
  showLoading('OneDriveにアップロード中...');
  const uploadRes = await fetch(
    `https://graph.microsoft.com/v1.0/me/drive/root:/LEENAI_tmp/${filename}:/content`,
    {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${S.graphToken}`,
        'Content-Type': 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      },
      body: arrayBuffer
    }
  );
  if (!uploadRes.ok) throw new Error(`Upload failed: ${uploadRes.status}`);
  const fileId = (await uploadRes.json()).id;

  showLoading('PDFに変換中...');
  const pdfRes = await fetch(
    `https://graph.microsoft.com/v1.0/me/drive/items/${fileId}/content?format=pdf`,
    { headers: { 'Authorization': `Bearer ${S.graphToken}` } }
  );
  if (!pdfRes.ok) throw new Error(`PDF convert failed: ${pdfRes.status}`);
  const pdfBlob = await pdfRes.blob();

  // 임시 파일 삭제 (실패 무시)
  fetch(`https://graph.microsoft.com/v1.0/me/drive/items/${fileId}`,
    { method:'DELETE', headers:{'Authorization':`Bearer ${S.graphToken}`} }
  ).catch(()=>{});

  return pdfBlob;
}

// 発送
// ═══════════════════════════════════════
async function doSend() {
  if (!S.contractData) return;
  const { header: h, details, packer: pk, toAddr, ccAddrs } = S.contractData;
  const contractNo = h.cr49f_purchase_contract_no || '';
  const packerCode = pk.cr49f_packer_code || pk.cr49f_packer || '';

  if (!S.graphToken || Date.now() > S.graphExpiry) {
    const go = confirm('メール発送にはMicrosoft認証が必要です。\nログイン画面に移動しますか？');
    if (!go) return;
    saveDvSession();
    sessionStorage.setItem('pending_contract', JSON.stringify(S.contractData));
    sessionStorage.setItem('pending_contract_no', contractNo);
    await startLogin(GRAPH_SCOPE);
    return;
  }

  showLoading('PDF生成中...');
  try {
    S.contract = h;
    S.tokki = (document.getElementById('tokkiInput')?.value || '').trim();
    const pdfBlob = await generatePdfViaOneDrive(S, details, pk);
    const pdfB64 = await blobToBase64(pdfBlob);
    const pdfFilename = `${contractNo}_${packerCode}_購買契約書.pdf`;

    showLoading('下書き保存中...');

    const packerName = pk.cr49f_packer_name || '';
    const personName = pk.cr49f_packer_person || '';
    const F = `font-family:'Meiryo UI',Meiryo,sans-serif;font-size:10.5pt;`;
    const mailBody = `<div style="${F}line-height:1.8;color:#000;">
<p style="margin:0 0 0;">${packerName}</p>
<p style="margin:0 0 1.2em;">${personName} 様</p>
<p style="margin:0 0 1.2em;">いつも大変お世話になっております。<br>添付の通り、御契約書をお送りさせて頂きますので、ご確認後サインバックをお願い致します。</p>
<p style="margin:0 0 1.2em;">どうぞよろしくお願い致します。</p>
<p style="margin:0 0 0;">株式会社リニア</p>
<p style="margin:0 0 1.2em;">担当者：林成元(sw_lim@leenearcorp.com)</p>
<p style="margin:0;color:#999;font-size:9pt;">このメールはLEENAI自動化システムより送信されました。</p>
</div>`;

    const gRes = await fetch('https://graph.microsoft.com/v1.0/me/messages', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${S.graphToken}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        subject: `[${contractNo}] 御契約書のご送付　[リニア発信専用]`,
        body: { contentType: 'html', content: mailBody },
        toRecipients: [{ emailAddress: { address: toAddr } }],
        ccRecipients: ccAddrs.map(a => ({ emailAddress: { address: a } })),
        attachments: [{
          '@odata.type': '#microsoft.graph.fileAttachment',
          name: pdfFilename,
          contentType: 'application/pdf',
          contentBytes: pdfB64
        }]
      })
    });

    if (!gRes.ok) {
      const gErr = await gRes.json().catch(() => ({}));
      throw new Error(`Graph API ${gRes.status}: ${gErr?.error?.message || gRes.statusText}`);
    }

    const record = {
      contract_no: contractNo,
      packer_name: packerName,
      packer_code: packerCode,
      sent_at: new Date().toISOString(),
      sent_by: S.userEmail,
      to_addr: toAddr,
      pdf_filename: pdfFilename,
      status: 'draft'
    };
    await dbAdd(record);
    S.lastSent = record;
    hideLoading();
    setStep(2);
  } catch(e) {
    hideLoading();
    alert('発送エラー: ' + e.message);
  }
}

function blobToBase64(blob) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.readAsDataURL(blob);
  });
}

async function renderHistory() {
  if (!db) return;
  const records = await dbGetAll();
  const el = document.getElementById('historyList');
  if (!records.length) {
    el.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:20px 0;">発送履歴がありません</div>';
    return;
  }
  el.innerHTML = records.map(r => {
    const time = r.sent_at ? new Date(r.sent_at).toLocaleString('ja-JP') : '—';
    const cls = r.status === 'sent' ? 'status-sent' : 'status-failed';
    const label = r.status === 'sent' ? '✅ 送信済' : '❌ 失敗';
    return `<div class="history-item">
      <div>
        <div class="history-no">${r.contract_no}</div>
        <div class="history-meta">${r.packer_name} · To: ${r.to_addr}</div>
        <div class="history-meta">${r.pdf_filename}</div>
        <div class="history-meta">${time} · ${r.sent_by}</div>
      </div>
      <span class="status-badge ${cls}">${label}</span>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════
// 起動
// ═══════════════════════════════════════
(async function init() {
  const handled = await handleCallback();
  if (!handled) {
    // show login (already visible by default)
  }
})();
</script>
