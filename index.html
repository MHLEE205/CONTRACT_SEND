<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link id="leenaiFavicon" rel="icon">
<link rel="stylesheet" href="https://mhlee205.github.io/LEENAI_COMMON/v1/leenai-common.css">
<script src="https://mhlee205.github.io/LEENAI_COMMON/v1/leenai-common.js"></script>
<script>if(!window.LEENAI){document.addEventListener('DOMContentLoaded',function(){document.body.innerHTML='<div style="padding:40px;font-family:sans-serif">共通ファイルの読み込みに失敗しました。ページを再読み込みしてください。</div>';});}</script>
<style>
.card{background:var(--read);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:14px}
.stat{font-family:var(--mono);font-size:13px;margin:4px 0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.danger{color:var(--danger)}.info{color:var(--info)}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.cg>div{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.8}
.cg b{display:block;font-size:11px;color:var(--text2);font-weight:600}
@media(max-width:700px){.cg{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app" style="display:none">
  <main style="max-width:900px;margin:0 auto;padding:24px 20px">
    <div class="card">
      <h3>&#35469;&#35388;&#12473;&#12486;&#12540;&#12479;&#12473;</h3>
      <div class="stat">Dataverse: <span id="st-dv">-</span></div>
      <div class="stat">Graph: <span id="st-gr">-</span></div>
      <div class="stat">graphError: <span id="st-grerr" style="color:var(--warn)">-</span></div>
    </div>
    <div class="card">
      <h3>&#12518;&#12540;&#12470;&#12540;&#24773;&#22577;</h3>
      <div class="stat">name: <span id="u-name">-</span></div>
      <div class="stat">email: <span id="u-email">-</span></div>
      <div class="stat">staffCode: <span id="u-staff">-</span></div>
    </div>
    <div class="card">
      <h3>Dataverse &#30758;&#36890; (WhoAmI)</h3>
      <div class="stat" id="dv-result">-</div>
    </div>
    <div class="card">
      <h3>Graph &#30758;&#36890; (GET /me)</h3>
      <div class="stat" id="gr-result">-</div>
    </div>
    <div class="card">
      <h3>&#12488;&#12540;&#12463;&#12531;&#26356;&#26032;&#12486;&#12473;&#12488;</h3>
      <button class="ln-btn-ghost" id="btn-refresh">token('dataverse') &#12434;&#20877;&#21462;&#24471;</button>
      <div class="stat" id="refresh-result" style="margin-top:8px">-</div>
    </div>
    <div class="card">
      <h3>&#25991;&#23383;&#33394;&#12481;&#12455;&#12483;&#12463; (&#20840;&#12486;&#12540;&#12510;&#12391;&#35501;&#12417;&#12427;&#12371;&#12392;)</h3>
      <div id="cgrid"></div>
    </div>
    <div class="card">
      <h3>&#20849;&#36890;&#37096;&#21697;&#12486;&#12473;&#12488;</h3>
      <button class="ln-btn-ghost" onclick="LEENAI.loading.show('&#12525;&#12540;&#12487;&#12451;&#12531;&#12464;&#12486;&#12473;&#12488;&#20013;&#8230;');setTimeout(function(){LEENAI.loading.hide();},2000)" style="margin:4px">Loading 2&#31186;</button>
      <button class="ln-btn-ghost" onclick="LEENAI.toast('ok &#12486;&#12473;&#12488;','ok')" style="margin:4px">toast ok</button>
      <button class="ln-btn-ghost" onclick="LEENAI.toast('warn &#12486;&#12473;&#12488;','warn')" style="margin:4px">toast warn</button>
      <button class="ln-btn-ghost" onclick="LEENAI.toast('danger &#12486;&#12473;&#12488;','danger')" style="margin:4px">toast danger</button>
      <button class="ln-btn-ghost" onclick="LEENAI.toast('info &#12486;&#12473;&#12488;','info')" style="margin:4px">toast info</button>
      <button class="ln-btn-ghost" onclick="LEENAI.addHeaderButton({label:'&#12486;&#12473;&#12488;Btn',onClick:function(){alert('&#12إder&#12540;Btn!');}})" style="margin:4px">addHeaderButton</button>
    </div>
  </main>
</div>
<script>
async function startTool(){
  var s=LEENAI.auth.status;
  var u=LEENAI.user;
  document.getElementById('st-dv').textContent=s.dataverse;
  document.getElementById('st-dv').className=s.dataverse==='ok'?'ok':'danger';
  document.getElementById('st-gr').textContent=s.graph;
  document.getElementById('st-gr').className=s.graph==='ok'?'ok':s.graph==='error'?'warn':'';
  document.getElementById('st-grerr').textContent=s.graphError||'-';
  if(u){
    document.getElementById('u-name').textContent=u.name;
    document.getElementById('u-email').textContent=u.email;
    document.getElementById('u-staff').textContent=u.staffCode;
  }
  try{
    var t=await LEENAI.auth.token('dataverse');
    var r=await fetch('https://orgde512c6f.crm7.dynamics.com/api/data/v9.2/WhoAmI()',{headers:{Authorization:'Bearer '+t,Accept:'application/json'}});
    var j=await r.json();
    document.getElementById('dv-result').innerHTML='<span class="ok">✔ UserId: '+j.UserId+'</span>';
  }catch(e){document.getElementById('dv-result').innerHTML='<span class="danger">✖ '+e.message+'</span>';}
  try{
    var gt=await LEENAI.auth.token('graph');
    if(gt){
      var r2=await fetch('https://graph.microsoft.com/v1.0/me',{headers:{Authorization:'Bearer '+gt}});
      var j2=await r2.json();
      document.getElementById('gr-result').innerHTML='<span class="ok">✔ '+j2.displayName+' / '+j2.mail+'</span>';
    } else {document.getElementById('gr-result').textContent='skip';}
  }catch(e){document.getElementById('gr-result').innerHTML='<span class="danger">✖ '+e.message+'</span>';}
  document.getElementById('btn-refresh').addEventListener('click',async function(){
    var el=document.getElementById('refresh-result');
    try{var t2=await LEENAI.auth.token('dataverse');el.innerHTML='<span class="ok">✔ token取得成功 ('+t2.slice(0,20)+'…)</span>';}
    catch(e){el.innerHTML='<span class="danger">✖ '+e.message+'</span>';}
  });
  var bgs=[['★ read','--read'],['frame','--frame'],['surface2','--surface2'],['surface3','--surface3']];
  var fgs=[['text','--text'],['text2','--text2'],['text3','--text3'],['accent','--accent'],['ok','--ok'],['warn','--warn'],['danger','--danger'],['info','--info']];
  var g=document.getElementById('cgrid'); g.className='cg';
  g.innerHTML=bgs.map(function(b){return '<div style="background:var('+b[1]+')"><b>'+b[0]+'</b>'+fgs.map(function(f){return '<div style="color:var('+f[1]+')">'+f[0]+'</div>';}).join('')+'</div>';}).join('');
}
LEENAI.init({
  sys:'Z-05', name:'COMMON TEST', version:'1.0', date:'2026-10-07',
  desc:'LEENAI_COMMON v1 動作確認ページ',
  onReady: startTool
});
</script>
</body>
</html>
